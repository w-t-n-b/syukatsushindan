<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>e2e driver</title>
<!-- 実ブラウザでの結合テスト用ドライバ。make e2e が一時的にサイト直下へ置いて実行し、終わったら消す。
     index.html を iframe で読み込み、実際のDOM・CSS・タイマーの上で操作を再現する。 -->
<style>body{font:12px/1.6 monospace;white-space:pre-wrap;margin:0;padding:8px}
iframe{position:fixed;top:0;right:0;width:390px;height:844px;border:1px solid #ccc;background:#fff}
pre{margin-right:400px}</style>
</head><body>
<pre id="out">running...</pre>
<iframe id="f" src="about:blank"></iframe>
<script>
const OUT=[];const el=document.getElementById('out');
const p=s=>{OUT.push(s);el.textContent=OUT.join('\n');};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
function load(url){return new Promise(res=>{f.onload=()=>res();f.src=url;});}
const CODES=['HALS','HALG','HAWS','HAWG','HBLS','HBLG','HBWS','HBWG','DALS','DALG','DAWS','DAWG','DBLS','DBLG','DBWS','DBWG'];
// Qs の添字ごとの回答値（Qs は軸ごとに5問ずつのブロック配置）。6段階の端は ±3。
function ansFor(c){const s=[c[0]==='H'?1:-1,c[1]==='A'?1:-1,c[2]==='L'?1:-1,c[3]==='S'?1:-1];const o=[];for(let a=0;a<4;a++)for(let i=0;i<5;i++)o.push(s[a]*3);return o;}
// 軸ごとの5問ぶんの値を Qs の添字順（軸1→2→3→4のブロック）に並べる
function byAxis(m){const o=[];for(let a=1;a<=4;a++)o.push(...m[a]);return o;}
// 出題位置 p では Qs[Q_ORDER[p]] が出る。ansFor() は Qs の添字基準なので並べ替えて渡す。
function inOrder(w,vals){const o=w.eval('Q_ORDER');return o.map(i=>vals[i]);}
// 目盛は「どの出題位置（data-pos）の、どの値（data-v）か」で引く。
//   face … 'q'（診断画面 #q-list）/ 'lq'（LP埋め込み #lq-list）
function dot(d,face,pos,v){
  return [...d.querySelectorAll('.sdw[data-pos="'+pos+'"]')]
    .find(x=>x.dataset.face===face&&Number(x.dataset.v)===v);
}
// その面にいま並んでいる出題位置（本診断は1件、LPは5件）
function posOf(d,face){
  return [...d.querySelectorAll('#'+(face==='lq'?'lq-list':'q-list')+' .q-card')].map(c=>Number(c.dataset.pos));
}
// 診断画面で20問を通す。av は出題位置順の値の配列。
// last=false なら20問目の「結果を見る」は押さない。
async function runQuiz(w,d,av,last){
  for(let pos=0;pos<20;pos++){
    w.pick(dot(d,'q',pos,av[pos]));
    if(pos<19){w.nextPage();await sleep(35);}
  }
  if(last!==false){ w.nextPage(); await sleep(80); }
}
let fail=0;
const chk=(ok,msg)=>{if(!ok)fail++;p((ok?'OK  ':'NG  ')+msg);};

(async()=>{
try{
  // ---------- A. LP が正常に読み込まれ、スクリプトが最後まで走ったか ----------
  await load('index.html');
  let w=f.contentWindow,d=f.contentDocument;
  await sleep(1200);
  chk(typeof w.showResult==='function' && typeof w.buildAgentBlock==='function','スクリプトが最後まで評価された（HTMLパース破壊なし）');
  chk(d.querySelectorAll('#type-overview .tc').length===16,'16タイプグリッドが生成された: '+d.querySelectorAll('#type-overview .tc').length);
  chk(d.body.dataset.screen==='screen-title','body[data-screen]=screen-title');
  chk(d.querySelectorAll('.hero-stats,.hstat,#stat-count').length===0,'ヒーローの3連統計カードは削除された');
  chk(/20問・約3分/.test(d.querySelector('.hero-sub').textContent),'「20問・約3分」はサブコピーに残っている');
  chk(!!d.querySelector('.ftr a[href="privacy.html"]'),'フッターに privacy.html へのリンクがある');
  chk(getComputedStyle(d.querySelector('.ftr')).display!=='none','LPではフッターが表示されている');
  chk(d.querySelectorAll('.drawer a[href^="privacy.html"]').length===2,'ドロワーに運営情報リンク2件');
  chk(d.querySelectorAll('form,input[type=email]').length===0,'フォーム要素0件');
  chk(!/SPI|診断者数|希少度|しかいない|12,847/.test(d.body.innerText),'LP本文に SPI/診断者数/希少度 が無い');
  chk(/探し方のヒント/.test(d.body.innerText),'hero-sub が是正済み');
  const head=d.head.innerHTML;
  ['og:title','og:description','og:image','og:url','twitter:card'].forEach(k=>chk(head.indexOf(k)>=0,'head に '+k));
  chk(head.indexOf('summary_large_image')>=0,'twitter:card=summary_large_image');

  // og:image が実在するか
  const ogi=d.querySelector('meta[property="og:image"]').content;
  const r=await fetch(ogi.replace('https://w-t-n-b.github.io/syukatsushindan/',''));
  chk(r.ok,'og:image が取得できる ('+r.status+') '+ogi);

  // ---------- B. 20問通し × 16タイプ（実ブラウザ・実DOM） ----------
  for(const want of CODES){
    await load('index.html'); w=f.contentWindow; d=f.contentDocument;
    await sleep(60);
    w.startFresh('e2e');
    chk(d.getElementById('screen-quiz').classList.contains('active'),want+': 診断画面に遷移');
    if(want==='HALS'){
      chk(getComputedStyle(d.querySelector('.ftr')).display==='none','診断中はフッター非表示');
      chk(d.body.dataset.screen==='screen-quiz','body[data-screen]=screen-quiz');
    }
    const av=inOrder(w,ansFor(want));
    for(let pos=0;pos<20;pos++){
      const shown=posOf(d,'q');
      if(shown.join(',')!==String(pos)){chk(false,want+': Q'+(pos+1)+' の出題位置ずれ '+shown.join(','));break;}
      const pt=d.getElementById('prog-text').textContent;
      const wantPt='QUESTION '+String(pos+1).padStart(2,'0')+' / 20';
      if(pt!==wantPt){chk(false,want+': 進捗表示ずれ '+pt);break;}
      if(want==='HALS'&&pos===5){
        const grp=d.querySelectorAll('#prog-seg .ps-group').length;
        const cell=d.querySelectorAll('#prog-seg .ps-cell').length;
        const done=d.querySelectorAll('#prog-seg .ps-cell.done').length;
        const cur=[...d.querySelectorAll('#prog-seg .ps-group')].findIndex(g=>g.classList.contains('cur'));
        chk(grp===4&&cell===20,'.prog-seg は4群×5セル: '+grp+'群 '+cell+'セル');
        chk(done===5,'Q6表示時に完了セルが5: '+done);
        chk(cur===1,'現在地は2フェーズ目: '+cur);
        chk(d.querySelectorAll('#prog-seg .ps-cell.cur').length===1,'質問セル単位の現在地表示');
        chk(d.querySelectorAll('#q-list .q-card').length===1,'本診断は1画面1問');
        chk(d.querySelectorAll('#q-list .answer-panel').length===2,'A/B回答パネルが2枚');
      }
      w.pick(dot(d,'q',pos,av[pos]));
      w.nextPage();
      await sleep(35);
    }
    // ローディング 3.6s
    await sleep(6200);
    const rc=d.querySelector('.res-code');
    const got=rc?rc.textContent.trim():'(なし)';
    const gotJs=w.getCode();
    const nm=d.querySelector('.res-type-name');
    chk(d.getElementById('screen-result').classList.contains('active') && got===want,
        want+': 20問通しの判定 = '+got+'（getCode()='+gotJs+'）/ '+(nm?nm.textContent.trim():''));
    chk(gotJs===want,want+': getCode() 一致');
    if(want==='HALS'){
      const t=d.body.innerText;
      chk(!/希少度|診断者の|しかいない/.test(t),'結果画面に希少度/診断者%が無い');
      chk(!/孫正義|マッキンゼー|サイバーエージェント|トヨタ自動車|三菱商事/.test(t),'結果画面に実在の人名・企業名が無い');
      chk(/傾向の分類/.test(t),'「傾向の分類」の明示がある');
      chk(/掲載順に優劣はなく/.test(d.getElementById('screen-result').innerHTML),'職種例の注記がある');
      chk(d.querySelectorAll('.ab-link').length===0,'AGENTS が0件なので送客リンクは0件');
      chk(d.querySelectorAll('#agent-primary,#agent-secondary').length===0,'送客ブロックは DOM ごと描画されない');
      const rh=d.getElementById('screen-result').innerHTML;
      chk(rh.indexOf('最適な')<0 && rh.indexOf('あなた専用')<0 && rh.indexOf('内定率')<0,'禁止語（最適な/あなた専用/内定率）0件');
      chk(getComputedStyle(d.querySelector('.ftr')).display!=='none','結果画面ではフッター表示');
    }
  }

  // ---------- C. シェア導線 ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  await sleep(60);
  // 以前は jumpToType('HALS')（scores を捏造して結果全文を出す）で状態を作っていた。
  // C-6 でその経路を廃止したため、scores を直接置いて同じ状態を作る。
  w.eval("scores={1:5,2:5,3:5,4:5}"); await sleep(60);
  const SU=w.shareUrl('HALS');
  chk(SU==='https://w-t-n-b.github.io/syukatsushindan/?type=HALS&ref=share','shareUrl(): '+SU);
  chk(w.topUrl()==='https://w-t-n-b.github.io/syukatsushindan/','topUrl(): '+w.topUrl());
  let opened=null; w.open=(u)=>{opened=u;return null;};
  w.shareX();
  chk(decodeURIComponent(opened).indexOf(SU)>=0,'shareX のツイートURLにサイトURLが入る');
  chk(decodeURIComponent(opened).indexOf('希少')<0,'shareX から根拠なき統計が消えた');
  p('     shareX -> '+decodeURIComponent(opened).slice(0,200));
  w.shareLINE();
  chk(decodeURIComponent(opened).indexOf(SU)>=0,'shareLINE の本文にサイトURLが入る');
  p('     shareLINE -> '+decodeURIComponent(opened).slice(0,200));

  // copyLink: ?type= 付きで来た第三者がコピーしても診断トップになる
  await load('index.html?type=DBWG'); w=f.contentWindow; d=f.contentDocument;
  await sleep(200);
  chk(d.getElementById('screen-result').classList.contains('active'),'?type= 単体は従来どおり結果表示（非破壊）');
  let copied=null;
  Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:t=>{copied=t;return Promise.resolve();}}});
  w.alert=()=>{};
  w.copyLink(); await sleep(80);
  chk(copied==='https://w-t-n-b.github.io/syukatsushindan/','copyLink は診断トップを配る（?type= を含まない）: '+copied);
  w.copyResult(); await sleep(80);
  chk(copied.indexOf('?type=DBWG&ref=share')>=0,'copyResult に結果URLが入る');

  // ---------- D. ref=share 分岐 ----------
  await load('index.html?type=HALS&ref=share'); w=f.contentWindow; d=f.contentDocument;
  await sleep(300);
  chk(d.getElementById('screen-title').classList.contains('active'),'ref=share: LP が active');
  chk(!d.getElementById('screen-result').classList.contains('active'),'ref=share: 結果画面は非表示');
  chk(d.getElementById('screen-result').innerHTML.trim()==='','ref=share: 結果DOMそのものが生成されていない');
  const sb=d.querySelector('.shared-banner');
  chk(!!sb,'ref=share: .shared-banner がある');
  chk(sb && /HALS/.test(sb.innerText) && /オンオフのエース/.test(sb.innerText),'ref=share: HALS / オンオフのエース が出る');
  chk(!!(sb&&sb.querySelector('.sb-cta')),'ref=share: 診断開始CTAがある');
  sb.querySelector('.sb-cta').click(); await sleep(400);
  // §A-6: 友達のリンクで来た人こそ段差なしで答え始めさせる。#screen-quiz には飛ばさない。
  chk(!d.getElementById('screen-quiz').classList.contains('active'),'ref=share: CTAで #screen-quiz に飛ばない');
  chk(d.getElementById('screen-title').classList.contains('active'),'ref=share: LPのまま');
  chk(posOf(d,'lq').join(',')==='0,1,2,3,4','ref=share: #lp-quiz（Q1-5）に着地する: '+posOf(d,'lq').join(','));

  // ---------- E. 送客ブロック（AGENTS に1件入れたときの描画） ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  await sleep(60);
  // const 宣言は window のプロパティにならないので eval 経由で触る
  w.eval("AGENTS.push({id:'test-ca',name:'テストCA',url:'https://example.com/lp?a=1',forWhom:'まず何から始めるか決めきれていない人',meta:'無料／オンライン面談30分／連絡は原則メール・電話なし',company:'テスト株式会社',license:''})");
  // 未診断者の経路では出ないこと（C-6：16タイプ一覧のタップは結果全文を出さなくなった）
  d.querySelector('#type-overview .tc[data-code="HALS"]').click(); await sleep(300);
  chk(d.querySelectorAll('.ab-link').length===0,'16タイプ一覧のタップでは送客リンクを描画しない');
  chk(!d.getElementById('screen-result').classList.contains('active'),'16タイプ一覧のタップで結果画面に遷移しない');
  await load('index.html?type=HALS'); const w2=f.contentWindow;
  await sleep(250);
  w2.eval("AGENTS.push({id:'t',name:'t',url:'https://e.com',forWhom:'x',meta:'電話なし'});showResult(true,'shared')");
  await sleep(150);
  chk(f.contentDocument.querySelectorAll('.ab-link').length===0,'?type= 来訪（未診断者）でも送客ブロックを描画しない');
  // 20問回答した人にだけ出る
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(80);
  w.eval("AGENTS.push({id:'test-ca',name:'テストCA',url:'https://example.com/lp?a=1',forWhom:'まず何から始めるか決めきれていない人',meta:'無料／オンライン面談30分／連絡は原則メール・電話なし',company:'テスト株式会社',license:''})");
  w.startFresh('e2e');
  await runQuiz(w,d,inOrder(w,ansFor('HALS')));
  await sleep(6200);
  const ap=d.getElementById('agent-primary'), as=d.getElementById('agent-secondary');
  chk(!!ap&&!!as,'1件入れると #agent-primary / #agent-secondary が出る');
  chk(!!ap&&ap.querySelector('.ab-lbl').textContent==='PR','PR表記がブロック冒頭にある');
  const lk=ap.querySelector('a.ab-link');
  chk(lk.target==='_blank'&&/sponsored/.test(lk.rel)&&/noopener/.test(lk.rel),'rel/target: '+lk.rel+' / '+lk.target);
  chk(/電話/.test(ap.querySelector('.ab-meta').textContent),'.ab-meta に連絡手段（電話の有無）');
  chk(ap.querySelectorAll('.ab-note').length===1 && !/許可/.test(ap.querySelector('.ab-note').textContent),'許可番号が空なら出さない: '+ap.querySelector('.ab-note').textContent);
  chk(lk.getAttribute('href').indexOf('utm_content=HALS-primary')>=0,'utm_content=<CODE>-<position>: '+lk.getAttribute('href'));
  chk(!!ap.querySelector('.ab-disc'),'.ab-disc（紹介料の開示）がある');
  // 「向いている職種」パネルの直後か
  const panels=[...d.querySelectorAll('#screen-result .r-panel')];
  const jobPanel=panels.find(x=>/向いている職種/.test(x.textContent));
  chk(jobPanel && jobPanel.nextElementSibling===ap,'#agent-primary が「向いている職種」パネルの直後');
  chk(d.querySelector('.retry-btn').previousElementSibling===as,'#agent-secondary が「もう一度診断する」の直前');
  // タイプが変わっても掲載集合は同一
  w.eval("scores={1:-5,2:-5,3:-5,4:-5};showResult(true,'quiz')"); await sleep(150);
  chk([...d.querySelectorAll('#agent-primary .ab-name')].map(x=>x.textContent).join()==='テストCA','DBWG でも同じ掲載集合');
  chk(d.querySelector('#agent-primary a.ab-link').getAttribute('href').indexOf('utm_content=DBWG-primary')>=0,'DBWG の utm_content');
  // 許可番号があるときは .ab-note に出る
  w.eval("AGENTS[0].license='13-ユ-000000';scores={1:5,2:5,3:5,4:5};showResult(true,'quiz')"); await sleep(150);
  chk(/13-ユ-000000/.test(d.querySelector('#agent-primary .ab-note').textContent),'許可番号があれば .ab-note に出る: '+d.querySelector('#agent-primary .ab-note').textContent);
  // 掲載を空に戻すと枠ごと消える
  w.eval("AGENTS.length=0;showResult(true,'quiz')"); await sleep(150);
  chk(d.querySelectorAll('#agent-primary,#agent-secondary,.ab-link').length===0,'掲載を0件に戻すと枠ごと消える');

  // ---------- F. GA4 は測定IDが空なら一切読み込まれない ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  await sleep(400);
  chk(d.querySelectorAll('script[src*="googletagmanager"]').length===0,'GA_ID が空 → gtag.js を読み込まない');
  chk(typeof w.gtag==='undefined','GA_ID が空 → gtag が定義されない');
  chk(w.eval('GA_ID')==='','GA_ID は空文字');
  chk(w.eval('SITE_BASE')==='https://w-t-n-b.github.io/syukatsushindan/','SITE_BASE');
  chk(w.eval('AGENTS.length')===0,'出荷時の AGENTS は0件');

  // ---------- G-0. 副CTA・ドロワーの導線 ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(200);
  chk(d.querySelectorAll('.btn-ghost').length===0,'副CTA（主CTAと同一動作だった）は削除された');
  chk([...d.querySelectorAll('#screen-title button')].filter(x=>/continueOrStart/.test(x.getAttribute('onclick')||'')).length===2,
      'LP上の診断CTAは2つで、いずれも continueOrStart（ヒーロー・16タイプ一覧の下）');
  chk([...d.querySelectorAll('button')].filter(x=>/startFresh/.test(x.getAttribute('onclick')||'')).length===0,
      '回答を全消去する startFresh() を直接呼ぶボタンは1つも残っていない');
  // iframe 内ではスムーススクロールのアニメーションが走らないことがあるため、
  // scrollTo の引数を捕まえて「どこへ飛ばそうとしたか」を検証する。
  // 実ページでの実挙動は別途 CDP で確認済み。
  let scrolledTo=null; const realScrollTo=w.scrollTo.bind(w);
  w.scrollTo=(a,b)=>{scrolledTo=(a&&typeof a==='object')?a.top:b;return realScrollTo(a,b);};
  chk(d.querySelectorAll('.drawer').length===1 && d.querySelectorAll('.drawer .d-cta').length===1,'ドロワーの主CTAは1つ');
  chk([...d.querySelectorAll('.drawer button,.drawer a')].filter(x=>/診断をはじめる/.test(x.textContent)).length===1,'ドロワー内の「診断をはじめる」は1つに統合された');
  const catBtns=[...d.querySelectorAll('.drawer button')].filter(x=>/系$|系/.test(x.querySelector('.d-icon')?x.querySelector('.d-icon').textContent:''));
  chk(catBtns.length===4,'ドロワーの系統ボタン4つ');
  chk(catBtns.every(b=>/scrollToTypes/.test(b.getAttribute('onclick'))),'系統ボタン4つすべてに遷移先がある');
  for(const c of ['HA','HB','DA','DB'])chk(!!d.getElementById('type-cat-'+c),'アンカー #type-cat-'+c+' が存在');
  scrolledTo=null;
  catBtns[3].click(); await sleep(300);
  const dbTop=d.getElementById('type-cat-DB').getBoundingClientRect().top+w.pageYOffset-70;
  chk(scrolledTo!==null&&Math.abs(scrolledTo-dbTop)<2,'DB系ボタンはDB系の見出しへスクロールする: 指定y='+scrolledTo+' / 期待='+Math.round(dbTop));
  w.scrollTo=realScrollTo;

  // ---------- G. 途中復帰 ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  await sleep(60);
  w.startFresh('e2e');
  // 8問答えて離脱する
  for(let pos=0;pos<8;pos++){
    w.pick(dot(d,'q',pos,2));
    if(pos<7){w.nextPage();await sleep(35);}
  }
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
  chk(d.getElementById('cont-banner').style.display==='flex','途中離脱→リロードで #cont-banner が出る');
  w.continueDiag(); await sleep(120);
  chk(d.getElementById('screen-quiz').classList.contains('active'),'8問答えた人は #screen-quiz に復帰する');
  chk(d.getElementById('prog-text').textContent==='QUESTION 09 / 20',
      '復帰先は最初の未回答Q9: '+d.getElementById('prog-text').textContent);
  chk(w.eval('curQ')===8,'回答数8が復元される: '+w.eval('curQ'));
  chk(posOf(d,'q').join(',')==='8','Q9だけを表示して復帰する');
  w.clearSavedProgress();

  // 5問未満で離脱した人は LP に戻す（診断画面に飛ばさない）
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
  for(const pos of [0,1,2]) w.pick(dot(d,'lq',pos,2));
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
  chk(d.getElementById('cont-banner').style.display==='flex','LPで3問→リロードで #cont-banner が出る');
  w.continueDiag(); await sleep(120);
  chk(!d.getElementById('screen-quiz').classList.contains('active'),'3問だけの人を診断画面に飛ばさない');
  chk(d.querySelectorAll('#lq-list .sdw.sel').length===3,'LPの3問が選択済みで復帰する');
  w.clearSavedProgress();

  // ---------- H. LP埋め込み質問（5問・設置場所はヒーローの外）----------

  // LPで3問答えてヒーローCTA → 回答が消えず、診断画面の1ページ目へ（§A-2 の表）

  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  {
    // 3連の統計カードはカードごと削除した（数え上げの演出も一緒に消えた）
    chk(d.querySelectorAll('.hero-stats,.hstat,.hstat-num,.hstat-lbl,.hstat-div,#stat-count').length===0,
        '.hero-stats / .hstat 系が DOM に存在しない');
    await sleep(1500);
    chk(d.querySelectorAll('.hero-stats,.hstat').length===0,'1.5秒後も生成されない');
    chk(typeof w.animateCount==='undefined','animateCount() が存在しない');
    chk(typeof w.launchConfetti==='undefined','launchConfetti() が存在しない');
    chk(d.querySelectorAll('.conf-wrap,.conf').length===0,'紙吹雪のDOMが無い');
    // 結果画面まで通しても紙吹雪が生成されないこと
    w.eval("scores={1:15,2:15,3:15,4:15};ans=Array.from({length:20},()=>3);showResult(false,'quiz')");
    await sleep(1400);
    chk(d.querySelectorAll('.conf-wrap,.conf').length===0,'結果表示から1.4秒後も紙吹雪が発火しない');
    chk(d.getElementById('screen-result').classList.contains('active'),'結果画面は従来どおり表示される');
  }

  // ---------- N. 6段階スケールとタイブレーカー（実ブラウザ・20問通し）----------
  // 合計0の軸を意図的に作り、A側3・B側2 の多数決で決着することを確かめる。
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(80);
  {
    const ZA=[1,1,1,-1,-2];    // 合計0 / A側3・B側2
    const ZB=[-1,-1,-1,1,2];   // 合計0 / A側2・B側3
    w.startFresh('e2e');
    await runQuiz(w,d,inOrder(w,byAxis({1:ZB,2:ZA,3:ZB,4:ZA})));
    await sleep(6200);
    chk(w.eval('JSON.stringify(scores)')==='{"1":0,"2":0,"3":0,"4":0}','4軸すべての合計が0になった: '+w.eval('JSON.stringify(scores)'));
    const rc=d.querySelector('.res-code');
    chk(!!rc&&rc.textContent.trim()==='DAWS','合計0でも多数決で1つのタイプに決着する: '+(rc?rc.textContent.trim():'(なし)'));
    chk(w.getCode()==='DAWS','getCode() = '+w.getCode());
    // 「バランス型」ではなく、決着した向き＋僅差の但し書きを出す
    const avr=[...d.querySelectorAll('.av-result')].map(x=>x.textContent.trim());
    chk(avr.length===4&&avr.every(t=>/僅差/.test(t)),'診断スコアの4軸すべてに「僅差」の但し書き: '+avr.join(' / '));
    chk(!/バランス型/.test(d.getElementById('screen-result').innerText),'タイプコードと食い違う「バランス型」を出さない');
    // 判定理由のタグも同じ向きで出る（合計0でコードと逆を書かない）
    const rbt=[...d.querySelectorAll('.rbt')].map(x=>x.textContent.trim());
    chk(rbt.length===4&&/低/.test(rbt[0])&&/高/.test(rbt[1]),'判定理由のタグが判定と同じ向き: '+rbt.join(' / '));
    w.clearSavedProgress();
  }

  // 6段階の各値が正しい重みで加算される（LP側）
  for(const v of [3,2,1,-1,-2,-3]){
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
    const ax=w.eval('qAt(0).ax');
    w.pick(dot(d,'lq',0,v)); await sleep(30);
    chk(w.eval('scores['+ax+']')===v,'値 '+(v>0?'+':'')+v+' が軸'+ax+'に加算される: '+w.eval('scores['+ax+']'));
    w.clearSavedProgress();
  }

  // ---------- N-2. 選び直しても二重加算されない（§B-3）----------
  // 5問を同時に出す以上、同じ設問を選び直せる。旧実装の scores[ax]+=v は
  // 2回選ぶと2回足された。ここが壊れると全タイプの判定が静かにずれる。
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
  {
    const ax=w.eval('qAt(0).ax');
    for(const v of [3,2,1,-1,-2,-3,2]) { w.pick(dot(d,'lq',0,v)); await sleep(15); }
    chk(w.eval('scores['+ax+']')===2,'LPで7回選び直しても最後の +2 だけ: '+w.eval('scores['+ax+']'));
    chk(w.eval('curQ')===1,'回答数は1のまま: '+w.eval('curQ'));
    chk(d.querySelectorAll('#lq-list .q-card[data-pos="0"] .sdw.sel').length===1,'選択済みの目盛は1つだけ');

    // 診断画面でも同じ。20問すべてを一度逆に選んでから選び直しても結果が変わらない
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(200);
    w.startFresh('e2e');
    const av=inOrder(w,ansFor('DBWG'));
    for(let pos=0;pos<20;pos++){
      w.pick(dot(d,'q',pos,-av[pos]));       // いったん逆
      w.pick(dot(d,'q',pos,av[pos]));        // 選び直す
      if(pos<19){w.nextPage();await sleep(35);}
    }
    chk(w.eval('JSON.stringify(scores)')==='{"1":-15,"2":-15,"3":-15,"4":-15}',
        '全20問を逆→正で選び直してもスコアが正しい: '+w.eval('JSON.stringify(scores)'));
    chk(w.getCode()==='DBWG','選び直しを挟んでも判定が変わらない: '+w.getCode());
    w.clearSavedProgress();
  }

  // 旧スケールの保存データ（cq_p2）は黙って捨てる
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(200);
  w.localStorage.setItem('cq_p2',JSON.stringify({curQ:7,scores:{1:5,2:5,3:5,4:5},ans:[2,2,2,2,2,2,2],selectedIndustries:[]}));
  w.localStorage.setItem('cq_p',JSON.stringify({curQ:3,scores:{1:2,2:0,3:0,4:0},ans:[2,2,2],selectedIndustries:[]}));
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(400);
  chk(w.localStorage.getItem('cq_p2')===null&&w.localStorage.getItem('cq_p')===null,'旧キー cq_p / cq_p2 は起動時に削除される');
  chk(d.getElementById('cont-banner').style.display!=='flex','旧スケールのデータでは #cont-banner を出さない');
  chk(w.eval('curQ')===0&&w.eval('JSON.stringify(scores)')==='{"1":0,"2":0,"3":0,"4":0}','旧データがあっても1問目・スコア0から始まる');

  // ---------- O. キャラ画像の頭が切れていないこと ----------
  // .tc img / .cc img は縦長画像を横長寄りの枠に object-fit:cover で嵌めるので縦が切れる。
  // 全16体を実測し、頭頂（--head）が可視領域の内側に入っていることを確かめる。
  // 枠幅が可変な .tc は、いちばん強く切り取る条件（f=0.397 / vw>=480）でも確かめる。
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
  {
    const probe=(sel,imgSel,fMin)=>{
      const out=[];
      d.querySelectorAll(sel).forEach(card=>{
        const im=card.querySelector(imgSel); if(!im)return;
        const code=(im.src.match(/([a-d]\d)\.webp/)||[])[1]||'?';
        if(out.some(o=>o.code===code))return;
        const head=parseFloat(getComputedStyle(card).getPropertyValue('--head'));
        const y=parseFloat(getComputedStyle(im).objectPosition.split(' ')[1]);
        /* object-fit が働くのは padding を除いたコンテンツ領域。DAWG(c4) は
           左右に padding を入れて描画幅を縮めているので、border-box の幅で
           計算すると実際より強く切り取られていると誤判定する。 */
        const cs=getComputedStyle(im);
        const b=im.getBoundingClientRect();
        const padded=b.width-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
        const inner=b.height-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
        const fNow=inner/(padded*(im.naturalHeight/im.naturalWidth));
        const marg=ff=>ff>=1?100:(head-y*(1-ff))/(100*ff)*100;
        /* fMin は枠幅が可変な .tc の最悪条件。padding があるキャラは幅の比率が
           変わるので、実測の f との比で補正する。 */
        const fMinAdj=fMin*(fNow/(b.height/(b.width*(im.naturalHeight/im.naturalWidth))));
        out.push({code,head,y,f:+fNow.toFixed(3),now:+marg(fNow).toFixed(1),min:+marg(fMinAdj).toFixed(1)});
      });
      return out;
    };
    const tc=probe('#type-overview .tc','img',0.397);
    const cc=probe('.char-strip-track .cc','img',0.772);
    chk(tc.length===16&&tc.every(o=>!isNaN(o.head)),'16タイプ一覧の全16体に --head（実測の頭頂位置）が定義されている: '+tc.length);
    chk(cc.length===16&&cc.every(o=>!isNaN(o.head)),'キャラマーキーの全16体に --head が定義されている: '+cc.length);
    const badTc=tc.filter(o=>o.now<0||o.min<0);
    const badCc=cc.filter(o=>o.now<0||o.min<0);
    chk(badTc.length===0,'16タイプ一覧で頭が切れている体が0件'+(badTc.length?' → '+badTc.map(o=>o.code+'(余白'+Math.min(o.now,o.min)+'%)').join(','):''));
    chk(badCc.length===0,'キャラマーキーで頭が切れている体が0件'+(badCc.length?' → '+badCc.map(o=>o.code+'(余白'+Math.min(o.now,o.min)+'%)').join(','):''));
    /* 「余白 > 0」だけでは足りない。余白 4%（128px の枠で 5px）のとき、数値上は
       入っていても髪の先端が枠線に接して「切れている」と報告された（DAWG）。
       見た目の余白として 8% 以上を要求する。--head の値そのものは実測に依存する
       ので固定しない（画像を差し替えれば変わる。make heads で再計測する）。 */
    /* 目標は 8% だが、素材自身の頭上の余白がそれ未満のキャラでは達成できない
       （a2 は頭頂 1.4% なので、Y=0 にしても 1.4% ぶんしか出せない）。
       したがって条件は「8% 以上」ではなく「切り取りで余白を減らしていないこと」——
       すなわち 8% を満たすか、Y=0（画像の最上部から出しており、これ以上できない）。 */
    /* 8% を目標にしていたが、素材自身の頭上の余白がそれ未満のキャラが多く
       （実測 2.2〜9%）、Y=0 の免除でしか通らない状態だった。実測の中央値に
       近い 5% を下限とする。これを下回ると枠線に接して見える。 */
    const MIN_MARGIN=5;
    const tight=o=>Math.min(o.now,o.min)<MIN_MARGIN && o.y>0.01;
    const tightTc=tc.filter(tight), tightCc=cc.filter(tight);
    chk(tightTc.length===0,'16タイプ一覧: 頭上の余白が'+MIN_MARGIN+'%以上、または Y=0（素材の上限）'
        +(tightTc.length?' → '+tightTc.map(o=>o.code+':余白'+Math.min(o.now,o.min)+'% Y='+o.y+'%').join(','):''));
    chk(tightCc.length===0,'キャラマーキー: 頭上の余白が'+MIN_MARGIN+'%以上、または Y=0（素材の上限）'
        +(tightCc.length?' → '+tightCc.map(o=>o.code+':余白'+Math.min(o.now,o.min)+'% Y='+o.y+'%').join(','):''));
    // 頭頂がいちばん低い c4 は、固定値だと必ず破綻する。名指しでも押さえておく。
    const c4=tc.find(o=>o.code==='c4');
    chk(!!c4&&c4.head>=8,'DAWG(c4) の --head は実測どおり低い位置にある: '+(c4&&c4.head));
    p('     .tc 余白(%): '+tc.map(o=>o.code+':'+o.now).join(' '));
    p('     .cc 余白(%): '+cc.map(o=>o.code+':'+o.now).join(' '));
    // 結果画面のキャラ枠は縦の切り取りが起きない（f>=1）。ここを変えていないこと。
    w.eval("scores={1:15,2:15,3:15,4:15};ans=Array.from({length:20},()=>3);showResult(true,'quiz')");
    await sleep(600);
    const rch=d.querySelector('.res-char');
    const rb=rch.getBoundingClientRect();
    const rf=rb.height/(rb.width*(rch.naturalHeight/rch.naturalWidth));
    chk(rf>=1&&getComputedStyle(rch).objectPosition==='50% 50%',
        '.res-char は f>=1（縦の切り取りなし）で 50% 50% のまま: f='+rf.toFixed(3)+' / '+getComputedStyle(rch).objectPosition);
  }

  // ---------- P. LPに不自然な空白帯ができていないこと ----------
  // 実際に起きた不具合: .wrap の padding-bottom:100px が LP の中間セクションにも
  // 効いていて、.steps の下端から .type-grid の上端までが 329px 空いていた。
  // 「どこかのセクションが下に空白を抱えている」を一般化して押さえる。
  //   帯の測り方: #screen-title 内の「中身のある末端要素」を上から並べ、
  //   直前までの最下端と次の要素の上端の差＝どの要素も存在しない横帯の高さ。
  // 閾値 120px の根拠: セクション間の意図した空きは 40px + 40px = 80px。
  //   100px の死に領域が1つでも復活すると 180px になるので、その間に置く。
  const BAND=`(()=>{
    const root=document.getElementById('screen-title');
    const boxes=[];
    root.querySelectorAll('*').forEach(e=>{
      if(e.children.length && !/^(BUTTON|IMG)$/.test(e.tagName)) return;   // 葉だけ見る
      const cs=getComputedStyle(e);
      if(cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity)===0) return;
      const r=e.getBoundingClientRect();
      if(r.height<=0||r.width<=0) return;
      boxes.push({t:r.top+scrollY,b:r.bottom+scrollY,
        tag:e.tagName+(e.id?'#'+e.id:'')+(typeof e.className==='string'&&e.className?'.'+e.className.trim().split(/\\s+/)[0]:'')});
    });
    boxes.sort((a,b)=>a.t-b.t);
    let maxB=null,prev='',worst={gap:0,after:'',before:''};
    boxes.forEach(x=>{
      if(maxB!==null && x.t-maxB>worst.gap) worst={gap:x.t-maxB,after:prev,before:x.tag};
      if(maxB===null||x.b>maxB){maxB=x.b;prev=x.tag;}
    });
    worst.gap=Math.round(worst.gap);
    return JSON.stringify(worst);
  })()`;
  for(const vw of [390,320]){
    f.style.width=vw+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
    const band=JSON.parse(w.eval(BAND));
    chk(band.gap<=120,'LP('+vw+'px)に120pxを超える空白帯が無い: 最大 '+band.gap+'px（'+band.after+' → '+band.before+'）');
    // 不具合そのものの再発も名指しで押さえる（.steps の直後に何も無い帯が続く）。
    // .steps と 16タイプ一覧の間には #lp-quiz が入ったので、隣り合う2区間で測る。
    const sb=d.querySelector('.steps').getBoundingClientRect().bottom;
    const lqTop=d.querySelector('#lp-quiz .lq-head').getBoundingClientRect().top;
    const lqBot=d.querySelector('#lp-quiz .q-nav').getBoundingClientRect().bottom;
    const nx=d.querySelector('#type-section .sec-lbl').getBoundingClientRect().top;
    chk(Math.round(lqTop-sb)<=120,'診断の流れ→LP埋め込み質問 の間隔('+vw+'px): '+Math.round(lqTop-sb)+'px');
    chk(Math.round(nx-lqBot)<=120,'LP埋め込み質問→全16タイプ の間隔('+vw+'px): '+Math.round(nx-lqBot)+'px');
  }
  f.style.width='390px';

  // ---------- Q. 回答UI：LPと本診断の両方でA / Bが明示される ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(500);
  {
    chk(d.querySelectorAll('.choice-box,.choice-row,.cb-l,.cb-r').length===0,
        '枠付きボックス（.choice-box / .cb-l / .cb-r）が DOM に無い');
    const lpCards=[...d.querySelectorAll('#lq-list .q-card')];
    chk(lpCards.length===5&&lpCards.every(c=>c.querySelectorAll('.choice-list .opt-line').length===2),
        'LPの5問はコンパクトなA/Bテキスト行を持つ');
    const lp0=lpCards[0];
    chk(lp0.querySelector('.opt-a .opt-key').textContent==='A.'&&lp0.querySelector('.opt-b .opt-key').textContent==='B.',
        'LPに接頭辞 A. / B. がある');

    w.startFresh('e2e'); await sleep(200);
    const card=d.querySelector('#q-list .q-card');
    const panels=[...card.querySelectorAll('.answer-panel')];
    chk(panels.length===2,'本診断はA/Bの大きな回答パネル2枚');
    chk(panels.map(x=>x.querySelector('.opt-key').textContent).join(',')==='A,B','回答パネルにA/Bを明示');
    chk(panels.every(x=>x.querySelector('.opt-txt').textContent.length>0),'A/B両方の本文が表示される');
    const la=getComputedStyle(panels[0]).borderLeftColor,lb=getComputedStyle(panels[1]).borderLeftColor;
    chk(la!==lb,'A側 / B側のアクセント色が違う: '+la+' vs '+lb);
    const dots=[...card.querySelectorAll('.sdw')];
    chk(dots.map(x=>x.dataset.v).join(',')==='3,2,1,-1,-2,-3','6段階の並び: '+dots.map(x=>x.dataset.v).join(','));
    chk(dots.map(x=>x.textContent.trim()).join(',')==='かなり近い,近い,やや近い,やや近い,近い,かなり近い',
        '強度をテキストで表示: '+dots.map(x=>x.textContent.trim()).join(','));
    chk(!panels[0].classList.contains('on')&&!panels[1].classList.contains('on'),'未回答時はどちらも未選択');
    w.pick(dot(d,'q',0,3));await sleep(30);
    chk(panels[0].classList.contains('on')&&!panels[1].classList.contains('on'),'A回答でAパネルを強調');
    w.pick(dot(d,'q',0,-3));await sleep(30);
    chk(!panels[0].classList.contains('on')&&panels[1].classList.contains('on'),'選び直すとBパネルへ強調が移る');
    const labs=dots.map(x=>x.getAttribute('aria-label'));
    chk(labs.slice(0,3).every(x=>x.indexOf('A')>=0&&x.indexOf('B')<0)
      &&labs.slice(3).every(x=>x.indexOf('B')>=0&&x.indexOf('A')<0),
      '目盛の aria-label が A側3つ / B側3つに分かれている: '+labs.join(' / '));
    w.clearSavedProgress();
  }

  // ---------- Q-2. 目盛のタッチターゲット（WCAG 2.5.8 = 24x24）----------
  // 外側を大きく内側を小さくしたぶん、いちばん小さい ±1 が基準を割らないこと。
  // 5問ずつ化でカードの余白を詰めたので、ここが最初に効いてくる。
  // 1ページの高さも併せて測る（目標: 約1,600px以内。仕様 §D-3）。
  for(const vw of [390,320]){
    f.style.width=vw+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(700);
    for(const [face,name] of [['lq','LP埋め込み'],['q','診断画面']]){
      if(face==='q'){ w.startFresh('e2e'); await sleep(200); }
      // 5問ぶんすべての目盛を測る（1問目だけ通っても意味がない）
      let min=1e9, sample='';
      for(const pos of posOf(d,face)){
        const rs=[3,2,1,-1,-2,-3].map(v=>{const b=dot(d,face,pos,v).getBoundingClientRect();
          return {v,w:Math.round(b.width),h:Math.round(b.height)};});
        if(pos===posOf(d,face)[0]) sample=rs.map(o=>(o.v>0?'+':'')+o.v+':'+o.w+'x'+o.h).join(' ');
        min=Math.min(min,rs.reduce((a,b)=>Math.min(a,b.w,b.h),1e9));
      }
      chk(min>=24,name+'('+vw+'px)の目盛は5問すべて・全段階が24px以上: 最小 '+min+'px / '+sample);
      // 横にはみ出していないこと
      const over=[...d.querySelectorAll('#'+(face==='lq'?'lq-list':'q-list')+' .q-card')]
        .filter(c=>c.scrollWidth>c.clientWidth+1).length;
      chk(over===0,name+'('+vw+'px)でカードから横にはみ出している問が0件');
    }
    // 1ページの高さ（診断画面）。.prog-area + 5問 + 操作列
    const pageH=Math.round(d.querySelector('.quiz-inner').getBoundingClientRect().height
                          +d.querySelector('.prog-area').getBoundingClientRect().height);
    const cardH=Math.round(d.querySelector('#q-list .q-card').getBoundingClientRect().height);
    chk(pageH<=1600,'診断画面1ページの高さ('+vw+'px): '+pageH+'px（カード1枚 '+cardH+'px・目標1,600px以内）');
    p('     '+vw+'px: 1ページ '+pageH+'px / カード1枚 '+cardH+'px / 横スクロール '
      +(d.documentElement.scrollWidth>vw));
    chk(d.documentElement.scrollWidth<=vw,'横スクロールが発生しない('+vw+'px): scrollWidth='+d.documentElement.scrollWidth);
    w.clearSavedProgress();
  }
  f.style.width='390px';

  // ---------- R. サブタイプに説明が付いていること ----------
  // 「サブタイプってなんのことだ」（オーナー）。コードとキャラだけでは伝わらない。
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
  {
    // 僅差の軸を作る（軸1だけ ±1）。getSubCode() は軸1を反転したコードを返す。
    w.eval("scores={1:1,2:9,3:9,4:9};ans=[3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,-3];showResult(false,'quiz')");
    await sleep(700);
    const card=d.querySelector('.subtype-card');
    chk(!!card,'サブタイプのカードが出る');
    const note=card&&card.querySelector('.sub-note');
    chk(!!note&&note.textContent.trim().length>=30,'.sub-note に説明がある: '+(note?note.textContent.slice(0,24)+'…':'なし'));
    chk(!!note&&/僅差/.test(note.textContent),'説明が「僅差だった軸を反転したもの」であることに触れている');
    // 断定しない姿勢（診断で分かるのは傾向まで）と矛盾しないこと
    chk(!!note&&!/必ず|断言|確実|あなたは.*です。/.test(note.textContent),'説明が断定表現を含まない');
    chk(card.querySelector('.sub-head').compareDocumentPosition(note)&Node.DOCUMENT_POSITION_FOLLOWING,
        '説明は見出し（.sub-head）の直後にある');
  }

  p('\n===== '+(fail===0?'ALL PASS':fail+' FAILURES')+' =====');
}catch(e){p('EXCEPTION: '+(e&&e.stack||e));p('\n===== EXCEPTION =====');}
document.title='DONE';
})();
</script></body></html>
