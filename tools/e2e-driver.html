    w.eval("scores={1:2,2:-5,3:-5,4:-7};ans=Array(20).fill(2);showResult(true,'quiz')");
    await sleep(600);
    const cf=w.eval(`(()=>{const f2=document.querySelector('.char-frame');
      const c=getComputedStyle(f2);
      let n=f2.parentElement,bg='rgba(0, 0, 0, 0)';

      return JSON.stringify({bg:c.backgroundColor,behind:bg});})()`);
    const CF=JSON.parse(cf);
    const cfBg=rgb(CF.bg);
    const cfBehind=rgb(CF.behind)||[255,255,255,1];
    const framePops=cfBg&&cfBg[3]>0.5&&ratio(cfBg,cfBehind)>1.02;
    chk(!framePops,'キャラの枠が地の上に箱として浮かない（透明な余白から面が出ない）: 枠'
        +CF.bg+' / 地'+CF.behind);

    /* ★3つめ。棒・点・数字が三者三様だった。
       .av-fill-l の幅 (AX_MAX+s)/2AX_MAX とマーカー (AX_MAX-s)/2AX_MAX は
       100-x の関係で、**互いに逆向きに動いていた**（対人13% でマーカー43% / 塗り57%）。
       いまは「中央からマーカーまで」を1本塗る。3つが同じことを言うかを測る。 */
    const rows=JSON.parse(w.eval(`JSON.stringify([...document.querySelectorAll('.av-row')].map(r=>({
      lbl:r.querySelector('.av-result').textContent.trim(),
      marker:parseFloat(r.querySelector('.av-marker').style.left),

    const bad=[];
    for(const r of rows){
      const pctTxt=(r.lbl.match(/(\d+)%/)||[])[1];
      const end=r.fLeft+r.fW;                       /* 塗りの端 */
      const touches=Math.abs(end-r.marker)<1.5||Math.abs(r.fLeft-r.marker)<1.5;
      const fromCenter=Math.abs(r.fLeft-50)<1.5||Math.abs(end-50)<1.5;
      const matches=pctTxt===undefined||Math.abs(r.fW-(+pctTxt)/2)<1.5;
      if(!touches||!fromCenter||!matches)
        bad.push(r.lbl+'（点'+r.marker+'% / 塗り'+r.fLeft+'〜'+end+'%）');
    }
    chk(bad.length===0,'棒と点と数字が同じことを言う（塗りは中央からマーカーまで・幅は%の半分）: '
        +(bad.join(' / ')||'4軸とも一致'));

    /* ★塗りが読めること。opacity .34 では地に対して 1.81:1 しかなく、
       棒があっても見えていなかった。これは飾りではなく強度を伝える図形なので
       WCAG 1.4.11 の 3:1 が要る（.34 → .62 にして 3.33:1）。
       ★「棒と点と数字が一致している」だけでは足りない。
         見えない棒は、一致していても何も言っていない。 */
    const fillR=+w.eval(`(()=>{
      const lum=c=>{const m=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
        return 0.2126*m[0]+0.7152*m[1]+0.0722*m[2];};
      const rgb=v=>{const m=String(v).match(/(\\d+), (\\d+), (\\d+)/);return m?[+m[1],+m[2],+m[3]]:null;};
      const fl=document.querySelector('.av-fill'), tr=document.querySelector('.av-track');
      const cs=getComputedStyle(fl), op=parseFloat(cs.opacity);

      const L1=lum(mixed),L2=lum(bg);
      return ((Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05)).toFixed(2);})()`);
    chk(fillR>=3,'スコアの塗りが目盛から見分けられる（1.4.11 は3:1）: '+fillR.toFixed(2)+':1');
  }

    chk(!!axSec&&axSec.textContent.trim().length>=40,'軸の説明文が入っている: '+axSec.textContent.slice(0,28)+'…');
    chk(!/[0-9]+%/.test(axSec.textContent),'その節に % を出さない（診断スコアとの二重掲載を避ける）');
    // 開示自体は診断スコアに残っている
    chk(d.querySelectorAll('.av-result').length===4,'4軸の開示は診断スコアに残っている');

    // getSubCode() は残す（golden の指紋 { code, sub, scores } が参照している）
    chk(typeof w.getSubCode==='function','getSubCode() は残っている（表示しないだけ）');
  }

  // ---------- S. ヒーローの作り替え（浮遊キャラ / 3ステップ削除 / ファーストビュー）----------
  // docs/design/hero-floating-characters.md 判断①〜⑭。
  // 「消したもの」と「残したもの」を両側から押さえ、コントラストは計算値ではなく
  // 実配信の webp を canvas で合成した実測値で判定する。
  // 幅の選び方: 320/390 は α の下限を決めているスマホ2体。768 は奥の2体が字面に
  // 最も深く重なる幅（em の字面は幅600px以上で 476px 固定なので、狭いほど食い込む）。
  // 1024 は据え置き。1440 は両端の2体が字面に1画素も重ならないことを押さえる幅。
  for(const [vw,vh,want] of [[390,844,2],[320,568,2],[768,1024,4],[1024,844,4],[1440,900,4]]){
    f.style.width=vw+'px'; f.style.height=vh+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(1200);
    const hero=d.querySelector('.hero');
    /* ★2026-09-11。キャラを「背景に薄く浮かぶ影」から「文字の上に乗る主役」へ
       移した（オーナー判断）。旧 .hero-cast / .hc はもう無い。
       守る対象が変わったので、検査もそこへ移す。
       旧: 影が薄いこと・字面の背後のコントラスト
       新: 4体が組み文字の中にいること・**文字を覆いすぎないこと** */
    const hcs=[...d.querySelectorAll('.hcx')];
    const T='('+vw+'x'+vh+') ';

    // --- 構造 ---
    chk(!d.querySelector('.hero-cast'),T+'旧 .hero-cast は作られない（.hcx が引き継いだ）');
    chk(hcs.length===4,T+'キャラは4体そろっている: '+hcs.length+' 体 '
        +hcs.map(e=>(e.src.match(/([a-d]\d)\.webp/)||[])[1]).join(','));
    chk(hcs.every(e=>e.closest('.hlk-row')),T+'4体とも組み文字（.hlk-row）の中にいる');
    chk(hcs.every(e=>e.alt===''&&e.getAttribute('aria-hidden')==='true'),
        T+'各 .hcx は alt="" / aria-hidden（読み上げは h1 の aria-label が担う）');
    chk(hcs.every(e=>e.complete&&e.naturalWidth>0),T+'.hcx の画像がすべて読み込めている');
    chk(hcs.every(e=>/\?v=/.test(e.getAttribute('src'))),T+'.hcx の src に ?v= が付いている');
    // ヒーローの高さはビューポートに依らずほぼ一定（判断②）
    const heroH=Math.round(hero.getBoundingClientRect().height);
    chk(getComputedStyle(hero).minHeight==='auto'||parseFloat(getComputedStyle(hero).minHeight)===0,
        T+'.hero に min-height が効いていない: '+getComputedStyle(hero).minHeight);
    /* ★上限のマジックナンバーをやめた（2026-09-09）。
       460 → 560 → …と、見出しを大きくするたびに数字を上げていた。
       上げ続ける数字は、いずれ何も守らなくなる。
       この検査が本当に言いたいのは次の3つで、どれも直接測れる。
         (1) min-height を持たない（＝画面いっぱいに引き伸ばしていない）
         (2) ビューポート未満（＝開いた瞬間に次が見えている）
         (3) 高さが中身の積算そのもの（＝どこにも謎の空きが無い）
       (3) は「padding ＋ 中身の実寸」と実際の高さを突き合わせれば分かる。
       絶対配置の子（装飾円・シルエット）は積算に入らないので除く。 */
    const heroBox=w.eval(`(()=>{
      const h=document.querySelector('#screen-title .hero');
      const c=getComputedStyle(h);
      let inner=0;
      for(const el of h.children){
        const s2=getComputedStyle(el);
        if(s2.position==='absolute'||s2.position==='fixed'||s2.display==='none') continue;
        inner += el.getBoundingClientRect().height
               + parseFloat(s2.marginTop) + parseFloat(s2.marginBottom);
      }
      return JSON.stringify({minH:c.minHeight, pt:parseFloat(c.paddingTop),
        pb:parseFloat(c.paddingBottom), inner:Math.round(inner),
        h:Math.round(h.getBoundingClientRect().height)});})()`);
    const HB=JSON.parse(heroBox);
    const noMinH = HB.minH==='0px'||HB.minH==='auto'||HB.minH==='none';
    chk(noMinH, T+'ヒーローに min-height が無い: '+HB.minH);
    chk(heroH<vh, T+'ヒーローがビューポート未満: '+heroH+'px < '+vh+'px');
    const sum=Math.round(HB.pt+HB.pb+HB.inner);
    chk(Math.abs(sum-HB.h)<=2,
        T+'ヒーローの高さが中身の積算そのもの（謎の空きが無い）: 実測'+HB.h
        +'px ＝ 上'+HB.pt+' ＋ 中身'+HB.inner+' ＋ 下'+HB.pb+' ＝ '+sum+'px');
    chk(d.documentElement.scrollWidth<=vw,T+'横スクロールが出ない: scrollWidth='+d.documentElement.scrollWidth);
    // 装飾円とシルエット（判断⑧⑪）
    chk([...d.querySelectorAll('.hero .hero-orb')].every(e=>getComputedStyle(e).display==='none'),
        T+'ヒーローの装飾円 .o1/.o2/.o3 が出ていない');
    chk(d.querySelectorAll('.hero .hero-orb').length===3,T+'装飾円の DOM は残っている（消していない）');
    chk(getComputedStyle(d.querySelector('.hero-sil')).display==='none',T+'.hero-sil は display:none のまま');

    // --- 幾何：重なりと CTA（§3-2 / §7-2）---
    if(hcs.length){
      syncField(d,w);                 /* 地の色を実物から取り直す */
      hcs.forEach(e=>{e.style.animation='none';});
      await sleep(60);
      const rects=hcs.map(e=>e.getBoundingClientRect());
      let cross=[];
      for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++){
        const a=rects[i],b=rects[j];
        if(a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom)cross.push(i+'x'+j);
      }
      chk(cross.length===0,T+'.hc 同士が重なっていない（重なると実効αが上がり AA を割る）'
          +(cross.length?' → '+cross.join(','):''));
      /* ヒーローCTA（#cta-hero）を削除した（オーナー判断・案C）ので、
         「押せるものの外形に .hc を重ねない」（1.4.11）の対象は
         .cont-banner（再訪者にだけ出る復帰バナー）1つになった。
         既定では display:none なので、測るあいだだけ出す。
         検査そのものは消さない —— 消すと、次に誰かがヒーローへ
         押せるものを戻したときに、重なりを誰も見なくなる。 */
      const cb=d.getElementById('cont-banner');
      const cbPrev=cb.style.display;
      cb.style.display='flex';
      await sleep(60);
      const btn=cb.getBoundingClientRect();
      const gaps=rects.map(r=>Math.round(btn.top-6-(r.bottom)));
      chk(Math.min(...gaps)>6,
          T+'どの .hc も復帰バナーの外形（影 6px 込み）に重ならない（1.4.11）: 余裕 '+gaps.join(' / ')+'px');
      cb.style.display=cbPrev;
      await sleep(60);
      /* ★旧「顔は見出しより上」（§3-4 の不等式1）は前提ごと無くなった。
         薄い影が文字の背後にいた頃、顔だけは文字に重ねないための条件だった。
         いまキャラは文字の前にいて、意図的に重なっている。
         代わりに見るのは「組み文字からはみ出して版面を壊していないこと」。 */
      const row=d.querySelector('.hlk-row').getBoundingClientRect();
      /* ★右の許容を 10% → 16% に広げた。黄は文字列の右の外に置いてある。
       「う」に重ねると71%、「う」と「。」の間へ寄せると「。」を94%覆う。
       大きくした体の逃げ場が文字の中に無いので、外に出すのが正しい。
       左の 22% は緑が「本当」の左に立つぶん。 */
    const out=rects.filter(r=>r.left<row.left-row.width*0.22||r.right>row.right+row.width*0.16);
      chk(out.length===0,
          T+'キャラが組み文字の版面から大きくはみ出さない: '+(out.length?out.length+'体':'すべて内側'));

      /* ★検査の穴（2026-09-09 に塞いだ）。
         上は「組み文字に対して」はみ出していないかを見ている。
         キャラは組み文字の左右の外に立つので、版面が画面いっぱいだと
         組み文字に対しては正しい位置のまま、画面の外で体が欠ける。
         実際 320/390/768px で緑の左が4〜11px、黄の右が5〜12px切れていた。
         横スクロールも出ないので誰も気づかない。基準を2つ持つ。 */
      const cut=rects.map((r,i)=>{
        const k=(hcs[i].className||'').match(/hcx-\w/);
        const L=Math.round(-r.left), R=Math.round(r.right-d.documentElement.clientWidth);
        return (L>0||R>0) ? (k?k[0]:'?')+(L>0?' 左'+L:'')+(R>0?' 右'+R:'')+'px' : null;
      }).filter(Boolean);
      chk(cut.length===0,
          T+'キャラが画面の外で欠けない: '+(cut.length?cut.join(' / '):'4体とも画面内'));

      // --- コントラスト実測（§7-1）。矩形ではなく字面の背後を測る ---
      /* ★色をハードコードするのをやめた（2026-09-09）。
         元は #cf9a24（からし）と #f2ece0 を直接書いていたが、これは
         QUIET RESTYLE 以前の色で、いまの画面には存在しない。
         **実体のない色でコントラストを測っていた。**
         ★さらに .hero-title em を前提にしていたため、見出しを組み文字
           （.hlk）に変えた時点で null 参照で落ちた。
         いまは見出しと説明文の中の「文字を持つ葉ノード」を全部拾い、
         色も大きさも実物から読む。構造を変えても落ちない。 */
      const leaves=[];
      for(const root of ['.hero-title','.hero-sub']){
        const el=d.querySelector(root); if(!el) continue;
        const walk=n=>{
          const own=[...n.childNodes].some(c=>c.nodeType===3&&c.textContent.trim());
          if(own) leaves.push(n);
          for(const c of n.children) walk(c);
        };
        walk(el);
      }
      const TXT=leaves.map(el=>{
        const cs=w.getComputedStyle(el);
        const m=cs.color.match(/(\d+), (\d+), (\d+)/);
        const size=parseFloat(cs.fontSize), wt=parseInt(cs.fontWeight)||400;
        /* WCAG 1.4.3 の「大きな文字」= 24px以上、または18.66px以上の太字 */
        const big = size>=24 || (size>=18.66 && wt>=700);
        return [el.className||el.tagName.toLowerCase(), [+m[1],+m[2],+m[3]],
                big?3:4.5, inkRects(el,6)];
      }).filter(t=>t[3].length);
      chk(TXT.length>0,T+'見出しと説明文の文字を拾えている: '+TXT.length+'箇所');
      for(const [name,col,need,areas] of TXT){
        chk(areas.length>0,T+name+' の字面を取得できた: '+areas.length+'行 '
            +areas.map(a=>'x'+Math.round(a.left)+'〜'+Math.round(a.right)).join(' '));
        const tl=lum(col[0],col[1],col[2]);
        let worst=null,worstI=null;
        hcs.forEach((im,i)=>{
          const a=parseFloat(getComputedStyle(im).opacity);
          for(const area of areas){
            const b=worstPixel(im,rects[i],a,area,tl);
            if(b&&(!worst||b.score>worst.score)){worst=b;worstI=i;}
          }
        });
        if(!worst){p('     '+T+name+'：字面の背後に .hc の画素なし（比は地色のまま）');continue;}
        const onLine=ratio(tl,worst.l), between=ratio(tl,worst.inter);
        chk(onLine>=need,
          T+name+' の字面の背後に .hc がある最悪画素で '+onLine.toFixed(3)+':1（基準 '+need+':1）'
          +' / 線の間 '+between.toFixed(3)+':1'
          +' ← '+(hcs[worstI].src.match(/([a-d]\d)\.webp/)||[])[1]
          +' α='+getComputedStyle(hcs[worstI]).opacity
          +' rgb('+worst.rgb.join(',')+') 実効α='+worst.a);
      }
      /* 以前はここでヒーローCTAの面（--verm）に .hc の画素が乗っていないことを
         見ていた。CTA を削除したので、同じ検査を復帰バナーの面（--paper）で行う。
         バナーは押せる要素であり、その地色と縁が .hc に汚されないことが要件。 */
      {
        /* ★地色のハードコード（#f2ece0）をやめた。バナーの実際の面を読む。 */
        const cbm=w.getComputedStyle(cb).backgroundColor.match(/(\d+), (\d+), (\d+)/);
        const paper=cbm?[+cbm[1],+cbm[2],+cbm[3]]:hex('#ffffff'),pl=lum(...paper);
        cb.style.display='flex';
        await sleep(60);
        const cbr=cb.getBoundingClientRect();
        let hit=null;
        hcs.forEach((im,i)=>{
          const b=worstPixel(im,rects[i],parseFloat(getComputedStyle(im).opacity),
            {left:cbr.left-6,right:cbr.right+6,top:cbr.top-6,bottom:cbr.bottom+6});
          if(b&&(!hit||b.l>hit.l))hit=b;
        });
        const bg=hit?hit.l:lum(...LINE);
        chk(!hit,T+'復帰バナーの外形に .hc の画素が1つも無い（--paper と背景の比 '+ratio(pl,bg).toFixed(3)
            +':1 は .hc に影響されない）');
        cb.style.display=cbPrev;
        await sleep(60);
      }
      hcs.forEach(e=>{e.style.animation='';});
    }

    // --- ファーストビュー（判断⑩）---
    {
      const q1=d.querySelector('#lq-list .q-card[data-pos="0"]');
      chk(!!q1,T+'ファーストビュー側に Q1 のカードがある');
      const b=q1.getBoundingClientRect();
      const part=s=>{const e=q1.querySelector(s);return e?Math.round(e.getBoundingClientRect().bottom):null;};
      p('     '+T+'Q1 カード y '+Math.round(b.top)+'〜'+Math.round(b.bottom)+' / fold '+vh
        +'（質問文 '+part('.q-text')+' / 選択肢 '+part('.choice-list')+' / 目盛 '+part('.spec-track')+'）');
      if(vw===390&&vh===844){
        chk(b.bottom<=vh,'390x844: Q1 のカード全体がファーストビューに入る: 下端 '+Math.round(b.bottom)+'px ≦ '+vh);
      }else if(vw===320&&vh===568){
        chk(b.top<vh,'320x568: Q1 のカードがファーストビューに顔を出す: 上端 '+Math.round(b.top)+'px < '+vh);
        chk(part('.q-text')!==null,'320x568: 質問文の要素がある（どこまで入るかは上の実測ログ）');
      }
    }

    // --- 動きの抑制（§7-3）。CSSOM から実際にパースされた規則を見る ---
    if(vw===390){
      let kf=null,rm=false;
      for(const ss of d.styleSheets){
        let rules;try{rules=ss.cssRules;}catch(e){continue;}
        for(const r of rules){
          if(r.type===CSSRule.KEYFRAMES_RULE&&r.name==='hcFloat')kf=r;
          if(r.type===CSSRule.MEDIA_RULE&&/prefers-reduced-motion/.test(r.conditionText)){
            for(const ir of r.cssRules)if(ir.selectorText==='.hc'&&ir.style.animationName==='none')rm=true;
          }
        }
      }
      chk(!!kf,'@keyframes hcFloat がスタイルシートに存在する');
      if(kf){
        const at=n=>[...kf.cssRules].find(r=>r.keyText.split(',').map(s=>s.trim()).includes(n));
        const a0=at('0%'),a100=at('100%');
        const zero=r=>!r||/^translateY\(0(px)?\)$/.test((r.style.transform||'').trim());
        chk(!!a0&&zero(a0)&&zero(a100),
            'hcFloat の 0% / 100% がともに translateY(0)（抑制時にずれた位置で止まらない）: '
            +(a0?a0.style.transform:'なし'));
      }
      chk(rm,'@media (prefers-reduced-motion:reduce) の animation:none が実際にパースされている');
      /* ★通常時は「登場のあと待機へ渡っている」ことを見る。
         登場アニメのまま止まっていると、静止画に戻る。 */
      await sleep(4200);
      const idle=[...d.querySelectorAll('.hcx')].filter(e=>e.classList.contains('idle'));
      chk(idle.length===4,'登場のあと4体とも待機の微動に渡っている: '+idle.length+' 体');
      const st=idle[0]&&getComputedStyle(idle[0]);
      chk(!!st&&/hcxIdle/.test(st.animationName)&&parseFloat(st.animationDuration)>=4,
          '待機の微動が動いている: '+(st&&st.animationName)+' '+(st&&st.animationDuration));
      chk(!!st&&parseFloat(st.opacity)===1,'待機に渡ってもキャラが消えない（opacity 1）: '+(st&&st.opacity));
      const lockLive=d.querySelector('.hlk').classList.contains('live');
      chk(lockLive,'文字も待機の微動に渡っている（.hlk.live）');
      const m1=getComputedStyle(d.querySelector('.hlk-m1>span'));
      chk(parseFloat(m1.opacity)===1,'待機に渡っても文字が消えない（opacity 1）: '+m1.opacity);
    }
  }
  /* ★旧「窓を狭めたら奥の2体を消す」検査は、前提ごと無くなった。
     体数を2/4で切り替えていたのは、薄い影が重なると実効αが上がって
     見出しが AA を割るためだった。いまは4体固定で、文字の前にいる。

     代わりに守るのは**文字の可読性**である。キャラが文字を覆いすぎると、
     何と書いてあるか読めなくなる。覆う量を測る。
     ★閾値は実測から決めた。参考画像と同じ「手前にいる」見え方を保ちつつ、
       どの文字も半分以上は残る。 */
  for(const [vw,vh] of [[1440,900],[1024,844],[768,1024],[390,844],[320,568]]){
    f.style.width=vw+'px'; f.style.height=vh+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument;
    /* ★登場が終わるまで待つ。1.4秒で測ったら「最大0%」と出た——
       キャラがまだ画面の外にいて、重なりようがなかった。
       **検査は「出来上がった状態」を測る。途中を測ると必ず通る。** */
    await sleep(4300);
    const T='('+vw+'x'+vh+') ';
    const worst=w.eval(`(()=>{
      const cs=[...document.querySelectorAll('.hcx')].map(e=>e.getBoundingClientRect());
      const letters=[['本当','.hlk-side'],['自','.hlk-m1>span:nth-child(1)'],
        ['分','.hlk-m1>span:nth-child(2)'],['を','.hlk-par'],
        ['知','.hlk-m2>span:nth-child(1)'],['ろ','.hlk-m2>span:nth-child(2)'],
        ['う','.hlk-m2>span:nth-child(3)'],['。','.hlk-dot']];
      let worst={n:'',p:0};
      for(const [n,sel] of letters){
        const e=document.querySelector(sel); if(!e) continue;
        const r=e.getBoundingClientRect(); const area=r.width*r.height; if(!area) continue;
        let cov=0;
        for(const c of cs){
          const ow=Math.max(0,Math.min(r.right,c.right)-Math.max(r.left,c.left));
          const oh=Math.max(0,Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top));
          cov+=ow*oh;
        }
        const p=Math.round(cov/area*100);
        if(p>worst.p) worst={n,p};
      }
      return JSON.stringify(worst);})()`);
    const wv=JSON.parse(worst);
    chk(wv.p<=55,T+'キャラが文字を覆いすぎない（どの文字も55%以下）: 最大 '+wv.n+' '+wv.p+'%');
  }
  f.style.width='390px'; f.style.height='844px';

  // 共有リンク（?ref=share）で来た人には浮遊キャラを出さない（§4 の状態表）
  await load('index.html?type=HALS&ref=share'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
  chk(!!d.querySelector('.shared-banner'),'?ref=share で .shared-banner が出る');
  /* ★旧 .hero-cast を消したので、共有着地でも .hcx（組み文字の中のキャラ）は出る。
     見出しの一部なので、出ないほうが不自然である。
     ここで見るのは「余分な .hero-cast を作っていないこと」だけ。 */
  chk(!d.querySelector('.hero-cast'),'?ref=share でも旧 .hero-cast は作られない');

  /* ---------- T. PC の版面（docs/design/conversion-structure-and-pc-grid.md）----------
     S-1 .hero-inner / .result-inner に 448px の柱
     S-2 16タイプ一覧を PC だけ4列に（スマホは2列8行のまま）
     S-3 .type-peek の挿入位置を列数非依存に
     S-6 .hero-trust（信頼の1行）
     S-9 PC の地を --paper2 に
     幅の選び方: 320/390 はスマホ（2列のまま）。767/768 は境界。1024/1440 は PC。 */
  {
    /* --- S-6 は撤回された。.hero-trust（登録不要 ｜ メールアドレス不要 ｜ 無料）は
           2026-09-08 のオーナー判断で削除。理由は2つ:
             ・今後、登録や個人情報の取得を行う可能性がある。書いてあると
               その時点で撤回する必要が生じる。先に約束しない
             ・書いてあってもユーザーの心理的プラスはそこまで働かない
           「あること」を守っていた5件を「戻っていないこと」に反転させた。
           同じ主張は t/*.html の .cta-note と meta description からも外してある。 */
    f.style.width='390px'; f.style.height='844px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(700);
    {
      chk(!d.querySelector('.hero-trust'),'.hero-trust が復活していない（S-6 は撤回）');
      const hero=d.querySelector('.hero').innerText;
      chk(!/登録不要|メールアドレス不要/.test(hero),'ヒーローに「登録不要／メールアドレス不要」が無い');
      const head=d.head.innerHTML;
      chk(!/登録不要/.test(head),'meta description / og:description に「登録不要」が無い');
    }

    /* --- 幅ごとの検査 --- */
    for(const [vw,vh,cols] of [[320,720,2],[390,844,2],[767,900,2],[768,1024,4],[1024,900,4],[1440,900,4]]){
      f.style.width=vw+'px'; f.style.height=vh+'px';
      await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
      const T='('+vw+') ';
      const pc=vw>=768;

      /* S-2: 列数。スマホは2列×8行のまま、PC だけ4列×4行 */
      const grids=[...d.querySelectorAll('#type-overview .type-grid')];
      chk(grids.length===4,T+'.type-grid はカテゴリごとに4本（HA/HB/DA/DB）: '+grids.length);
      const colCounts=grids.map(g=>getComputedStyle(g).gridTemplateColumns.trim().split(/\s+/).length);
      chk(colCounts.every(n=>n===cols),T+'16タイプ一覧は '+cols+' 列: '+colCounts.join(','));
      const rows=16/cols/4;   /* カテゴリあたりの行数 */
      chk(d.querySelectorAll('#type-overview .tc').length===16,T+'カードは16枚のまま');

      /* S-2: カード幅と縦の可視率 f。object-position の clamp 定数は
         最悪条件 f=0.397（枠幅 215px）で決めてある。f がそれを下回ると
         `make heads` の再計測と定数の書き換えが要る。 */
      /* ★切り取りをやめたので、頭の位置（--head）と可視域の計算は要らなくなった。
         見るのは「札の幅が広がりすぎないこと」と「一覧の版面」だけ。 */
      const cardW=Math.round(d.querySelector('#type-overview .tc img').getBoundingClientRect().width);
      p('     '+T+'札の絵の幅 '+cardW+'px');
      chk(cardW<=240,T+'一覧の絵が 240px を超えない（超えると1行が間延びする）: '+cardW+'px');

      /* ★系統ごとの地色（.cat-band）を全幅で敷いたので、#type-section の .wrap は
         もう版面を決めていない。中身の柱は各帯の .cat-inner が持つ。 */
      const bandInner=d.querySelector('#type-overview .cat-inner');
      const innerW=bandInner?Math.round(bandInner.getBoundingClientRect().width):0;
      chk(pc?innerW===Math.min(896,vw):innerW===Math.min(480,vw),
          T+'一覧の柱（.cat-inner）の幅: '+innerW+'px（PC は 896px 上限 / それ以外は 480px）');
      chk(innerW<=920,T+'一覧の柱は 920px を超えない');
      const band=d.querySelector('#type-overview .cat-band');
      chk(!!band&&Math.round(band.getBoundingClientRect().width)===vw,
          T+'系統の地色は全幅に敷かれている: '+(band?Math.round(band.getBoundingClientRect().width):0)+'px');

      /* S-1: ヒーローと結果ヒーローの柱 */
      const hiW=Math.round(d.querySelector('.hero-inner').getBoundingClientRect().width);
      chk(hiW===Math.min(448,vw-32),T+'.hero-inner の幅: '+hiW+'px（448px 上限）');

      /* T-3: body の地（旧 S-9）。body が見えるのは iOS のゴムバンドスクロールの
         上端と下端だけで、その両端に接するのは全画面で紺である。よって全幅で紺。
         S-9 は PC だけ --paper2 にしており、スマホには白が残っていた。 */
      /* ★QUIET RESTYLE で「暗い面」をやめた。body が見えるのは iOS の
         ゴムバンドスクロールの両端だけで、そこに接するのは全画面で
         同じ明るい地（--off #F2F2F3）である。よって全幅で同値。 */
      const bg=getComputedStyle(d.body).backgroundColor;
      chk(bg==='rgb(242, 242, 243)',
          T+'body の地は全幅で --off #F2F2F3: '+bg);

      /* T-1: 虹バーは「紺→クリーム」の境目にだけ在ること。
         ヒーロー下端に在った頃は、同一色の紺をこの1本が割っており、
         オーナーにはそこが層の境目に見えていた。 */
      const heroAfter=getComputedStyle(d.querySelector('.hero'),'::after').display;
      const lpqAfter =getComputedStyle(d.querySelector('#lp-quiz-sec'),'::after').display;
      chk(heroAfter==='none',T+'虹バーがヒーロー下端に無い（.hero::after: '+heroAfter+'）');
      chk(lpqAfter !=='none',T+'虹バーが Q1-5 の下端に在る（#lp-quiz-sec::after: '+lpqAfter+'）');
      chk(getComputedStyle(d.querySelector('#lp-quiz-sec')).position==='relative',
          T+'#lp-quiz-sec に position:relative がある（無いと虹バーがページ末尾へ飛ぶ）');
      const heroBg=getComputedStyle(d.querySelector('.hero')).backgroundColor;
      const lpqBg =getComputedStyle(d.querySelector('#lp-quiz-sec')).backgroundColor;
      chk(heroBg===lpqBg,T+'ヒーローと Q1-5 は同一の面（割る理由が無い）: '+heroBg);

      /* T-2: 読む面が札を浮かせていること。
         --paper #f2ece0 の札が --off #efe8da の地に載って 1.04:1 だった。
         地を --paper2 #e7dfcd にして 1.13:1 にする。WCAG の閾値ではない
         （1.4.11 は --navy 2px の枠が満たす）。「地を切り替えた以上、
         札が浮くこと」を守るための下限である。 */
      const lum=s=>{const m=s.match(/\d+/g).slice(0,3).map(v=>{v/=255;
        return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
        return 0.2126*m[0]+0.7152*m[1]+0.0722*m[2];};
      const ratio=(a,b)=>{const x=lum(a),y=lum(b);
        return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);};
      const tcR=ratio(getComputedStyle(d.querySelector('.tc')).backgroundColor,
                      getComputedStyle(d.querySelector('#type-section')).backgroundColor);
      /* 閾値 1.10:1 は据え置く。QUIET RESTYLE は札の輪郭を毛髪線まで
         細くしたので、地との明度差が消えると境目が本当に見えなくなる。
         そのために --off を #F2F2F3 にしてある（白い札に対し 1.12:1）。 */
      chk(tcR>=1.10,T+'16タイプの札が地から浮く: '+tcR.toFixed(2)+':1');

      /* S-3: .type-peek は「押した行の最後のカードの直後」に入る（列数非依存）。
         2列のときは偶然この式と一致していたが、4列では固定値 2 だと
         行の途中に割り込み、押したカードが視界から流れる。 */
      /* 実装と同じ式で期待値を作ると同義反復になるので、幾何で見る。
         (a) 押したカードが紹介より上にあること（＝視界から流れていない）
         (b) 紹介より上にあるカードの枚数が列数の倍数＝行の境目に入っていること */
      for(const idx of [0,1,2,3,5]){
        const r=w.eval(`(()=>{
          const tcs=[...document.querySelectorAll('#type-overview .tc')];
          const el=tcs[${idx}]; el.click();
          const pk=document.querySelector('.type-peek');
          if(!pk)return JSON.stringify({err:'no-peek'});
          const own=[...el.parentElement.querySelectorAll('.tc')];
          const cols=getComputedStyle(el.parentElement).gridTemplateColumns.trim().split(/\\s+/).length;
          const pb=pk.getBoundingClientRect(), eb=el.getBoundingClientRect();
          const above=own.filter(x=>x.getBoundingClientRect().bottom<=pb.top+1).length;
          const out={cols:cols,pushed:el.dataset.code,above:above,
                     pushedAbove:eb.bottom<=pb.top+1,
                     rowBoundary:above>0&&above%cols===0,
                     full:pb.width>=eb.width*cols};
          pk.remove();
          return JSON.stringify(out);
        })()`);
        const o=JSON.parse(r);
        chk(o.pushedAbove===true,T+idx+'枚目（'+o.pushed+'）: 押したカードは紹介より上に残る（視界から外れない）');
        chk(o.rowBoundary===true,T+idx+'枚目: 紹介は行の境目に入る（上にあるカード '+o.above+'枚 ＝ '+o.cols+'の倍数）');
        chk(o.full===true,T+idx+'枚目: 紹介パネルは行の全幅に伸びる（grid-column:1/-1）');
      }

      /* 結果画面（20問回答した扱い）。PC でヒーローが壊れていないこと。 */
      w.eval("scores={1:5,2:5,3:5,4:5};for(let i=0;i<20;i++)ans[i]=2;showResult(true,'quiz')");
      await sleep(500);
      const ri=Math.round(d.querySelector('.result-inner').getBoundingClientRect().width);
      const shW=[...d.querySelectorAll('.result-inner .share-grid .sh')].map(e=>Math.round(e.getBoundingClientRect().width));
      const fcW=Math.round(d.querySelector('.friend-card').getBoundingClientRect().width);
      p('     '+T+'.result-inner '+ri+'px / シェアボタン '+shW.join(',')+'px / .friend-card '+fcW+'px');
      chk(ri===Math.min(448,vw-40),T+'.result-inner の幅: '+ri+'px（448px 上限。S-1）');
      chk(shW.every(x=>x<=152),T+'シェアボタンが1つ152pxを超えない（S-1 の前は 1440px 幅で461px）: '+shW.join(','));
      chk(fcW===ri,T+'.friend-card が結果ヒーローの柱に収まる: '+fcW+'px');
      /* 直下の .wrap と幅がずれていないこと（S-1 が直した「3倍のずれ」） */
      const rw=Math.round(d.querySelector('#screen-result .wrap').getBoundingClientRect().width)-32;
      chk(Math.abs(rw-ri)<=8,T+'結果ヒーローと本文の内容幅がそろっている: '+ri+'px / '+rw+'px');
      chk(d.documentElement.scrollWidth<=vw+1,T+'結果画面で横スクロールが出ない: '+d.documentElement.scrollWidth);

      /* T-2（結果本文側）。1.04:1 は16タイプ一覧だけの問題ではなかった。
         .result-wrap も --off だったため、その上に載る --paper の札
         （.agent-block ＝ 送客ブロック / .famous-box / .ca）が全部沈んでいた。
         AGENTS が空のあいだ .agent-block は描かれないので、地の値そのものを守る。
         ★AGENTS に掲載を入れたら、.agent-block の実測比もここに足すこと。 */
      const rwBg=getComputedStyle(d.querySelector('.result-wrap')).backgroundColor;
      chk(rwBg==='rgb(242, 242, 243)',T+'結果本文の地は --paper2 #F2F2F3: '+rwBg);
      const fb=d.querySelector('.famous-box');
      if(fb){
        const r2=ratio(getComputedStyle(fb).backgroundColor,rwBg);
        chk(r2>=1.10,T+'.famous-box が結果本文の地から浮く: '+r2.toFixed(2)+':1');
      }
    }
    f.style.width='390px'; f.style.height='844px';
  }

  p('\n===== '+(fail===0?'ALL PASS':fail+' FAILURES')+' =====');
}catch(e){p('EXCEPTION: '+(e&&e.stack||e));p('\n===== EXCEPTION =====');}
document.title='DONE';
})();
</script></body></html>
