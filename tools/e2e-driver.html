<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">

<title>e2e driver</title>
<!-- 実ブラウザでの結合テスト用ドライバ。make e2e が一時的にサイト直下へ置いて実行し、終わったら消す。
     index.html を iframe で読み込み、実際のDOM・CSS・タイマーの上で操作を再現する。 -->
<style>body{font:12px/1.6 monospace;white-space:pre-wrap;margin:0;padding:8px}
iframe{position:fixed;top:0;right:0;width:390px;height:844px;border:1px solid #ccc;background:#fff}
pre{margin-right:400px}</style>
</head><body>
<pre id="out">running...</pre>
<iframe id="f" src="about:blank"></iframe>
<script>
const OUT=[];const el=document.getElementById('out');
const p=s=>{OUT.push(s);el.textContent=OUT.join('\n');};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
function load(url){return new Promise(res=>{f.onload=()=>res();f.src=url;});}
const CODES=['HALS','HALG','HAWS','HAWG','HBLS','HBLG','HBWS','HBWG','DALS','DALG','DAWS','DAWG','DBLS','DBLG','DBWS','DBWG'];
// Qs の添字ごとの回答値（Qs は軸ごとに5問ずつのブロック配置）。6段階の端は ±3。
function ansFor(c){const s=[c[0]==='H'?1:-1,c[1]==='A'?1:-1,c[2]==='L'?1:-1,c[3]==='S'?1:-1];const o=[];for(let a=0;a<4;a++)for(let i=0;i<5;i++)o.push(s[a]*3);return o;}
// 軸ごとの5問ぶんの値を Qs の添字順（軸1→2→3→4のブロック）に並べる
function byAxis(m){const o=[];for(let a=1;a<=4;a++)o.push(...m[a]);return o;}
// 出題位置 p では Qs[Q_ORDER[p]] が出る。ansFor() は Qs の添字基準なので並べ替えて渡す。
function inOrder(w,vals){const o=w.eval('Q_ORDER');return o.map(i=>vals[i]);}
// 1画面5問になったので、目盛は「トラックの中の何番目」ではなく
// 「どの出題位置（data-pos）の、どの値（data-v）か」で引く。
//   face … 'q'（診断画面 #q-list）/ 'lq'（LP埋め込み #lq-list）
function dot(d,face,pos,v){
  return [...d.querySelectorAll('.sdw[data-pos="'+pos+'"]')]
    .find(x=>x.dataset.face===face&&Number(x.dataset.v)===v);
}
// その面のいま出ているページに並んでいる出題位置
function posOf(d,face){
  return [...d.querySelectorAll('#'+(face==='lq'?'lq-list':'q-list')+' .q-card')].map(c=>Number(c.dataset.pos));
}
// 20問を通す。av は出題位置順の値の配列。
//   Q1-5  … LP（#lq-list）。ここにしか無い
//   Q6-20 … 診断画面（#q-list）の3ページ
// last=false なら最終ページの「次へ」は押さない（結果へ進めずに状態だけ作りたいとき）。
async function runQuiz(w,d,av,last){
  for(const pos of posOf(d,'lq')) w.pick(dot(d,'lq',pos,av[pos]));
  w.lqContinue(); await sleep(120);
  for(let p=1;p<4;p++){
    for(const pos of posOf(d,'q')) w.pick(dot(d,'q',pos,av[pos]));
    if(p<3){ w.nextPage(); await sleep(80); }
  }
  if(last!==false){ w.nextPage(); await sleep(80); }
}
// LP の5問を埋めて診断画面（Q6-10）まで進める。診断画面側だけを試したいときの下ごしらえ。
// かつての startFresh('e2e') の置き換え —— Q1 は LP にしか無いので、
// 診断画面に入るには必ず LP を通る（それが利用者の実際の道順でもある）。
async function enterQuiz(w,d,v){
  for(const pos of posOf(d,'lq')) w.pick(dot(d,'lq',pos,v===undefined?2:v));
  w.lqContinue(); await sleep(150);
}
let fail=0;
const chk=(ok,msg)=>{if(!ok)fail++;p((ok?'OK  ':'NG  ')+msg);};

/* --- コントラスト比の実測（浮遊キャラ用）------------------------------------
   docs/design/hero-floating-characters.md §7-1 は「線上＋α=.18 の純白画素」を
   最悪値として計算している。ここでは計算値ではなく、実際に配信している webp を
   canvas に描いて 1画素ずつ合成し、実測の最悪値を出す。 */
const srgb=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
const lum=(r,g,b)=>0.2126*srgb(r)+0.7152*srgb(g)+0.0722*srgb(b);
const ratio=(a,b)=>{const h=Math.max(a,b),l=Math.min(a,b);return (h+0.05)/(l+0.05);};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const over=(fg,a,bg)=>fg.map((v,i)=>v*a+bg[i]*(1-a));
/* .hero の地色 #132043 と、その上の集中線（rgba(255,255,255,.05)）。
   集中線は .hc より下の層なので、最悪値は必ず線上で出る。 */
const FIELD=hex('#132043');
const LINE=over([255,255,255],0.05,FIELD);
/* mask-image:linear-gradient(180deg,#000 0 52%,transparent 88%) の不透明度 */
const maskA=t=>t<=0.52?1:(t>=0.88?0:(0.88-t)/0.36);
/* 字面（グリフが実際に走る範囲）を返す。
   .hero-title em は display:block なので、要素の矩形は行ボックスの全幅になり、
   左右には文字が1画素も無い余白が含まれる。そこを「文字の背景」として測ると、
   文字が存在しない場所の背景色を文字のコントラストとして数えてしまう。
   WCAG 1.4.3 が言う背景は文字自身の背後なので、Range からグリフの走る矩形を取る。
   縁取り（text-shadow の 1.5px）・影（4px）・描画のにじみを含めるため 6px 広げる。
   ★ 判定の閾値（大きな文字 3:1 / 本文 4.5:1）は一切変えていない。変えたのは
     「どこを測るか」だけで、測る範囲は字面＋6px と安全側に取ってある。 */
function inkRects(el,pad){
  const out=[];
  for(const n of el.childNodes){
    if(n.nodeType!==3||!n.textContent.trim())continue;
    const rg=document.createRange();rg.selectNodeContents(n);
    for(const b of rg.getClientRects()){
      if(b.width<0.5||b.height<0.5)continue;
      out.push({left:b.left-pad,right:b.right+pad,top:b.top-pad,bottom:b.bottom+pad});
    }
  }
  return out;
}
/* 1体ぶんの最悪画素を返す。rect は測りたい範囲（文字の行ボックス等）。 */
function worstPixel(img,hcRect,opacity,clip){
  const W=Math.max(1,Math.round(hcRect.width)),H=Math.max(1,Math.round(hcRect.height));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,W,H);
  /* ゆらぎ（translateY 最大 6px）ぶん、上下に広げて走査する */
  const x0=Math.max(0,Math.floor(clip.left-hcRect.left));
  const x1=Math.min(W,Math.ceil(clip.right-hcRect.left));
  const y0=Math.max(0,Math.floor(clip.top-hcRect.top)-6);
  const y1=Math.min(H,Math.ceil(clip.bottom-hcRect.top)+6);
  if(x1<=x0||y1<=y0)return null;
  const px=cx.getImageData(x0,y0,x1-x0,y1-y0).data;
  let best=null;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const i=((y-y0)*(x1-x0)+(x-x0))*4;
    const a=px[i+3]/255*opacity*maskA(y/H);
    if(a<=0)continue;
    const onLine=over([px[i],px[i+1],px[i+2]],a,LINE);
    const l=lum(onLine[0],onLine[1],onLine[2]);
    if(!best||l>best.l)best={l,x,y,rgb:[px[i],px[i+1],px[i+2]],a:+a.toFixed(4),
      inter:lum(...over([px[i],px[i+1],px[i+2]],a,FIELD))};
  }
  return best;
}

(async()=>{
try{
  // ---------- A. LP が正常に読み込まれ、スクリプトが最後まで走ったか ----------
  await load('index.html');
  let w=f.contentWindow,d=f.contentDocument;
  await sleep(1200);
  chk(typeof w.showResult==='function' && typeof w.buildAgentBlock==='function','スクリプトが最後まで評価された（HTMLパース破壊なし）');
  chk(d.querySelectorAll('#type-overview .tc').length===16,'16タイプグリッドが生成された: '+d.querySelectorAll('#type-overview .tc').length);
  chk(d.body.dataset.screen==='screen-title','body[data-screen]=screen-title');
  chk(d.querySelectorAll('.hero-stats,.hstat,#stat-count').length===0,'ヒーローの3連統計カードは削除された');
  chk(/20問・約3分/.test(d.querySelector('.hero-sub').textContent),'「20問・約3分」はサブコピーに残っている');
  chk(!!d.querySelector('.ftr a[href="privacy.html"]'),'フッターに privacy.html へのリンクがある');
  chk(getComputedStyle(d.querySelector('.ftr')).display!=='none','LPではフッターが表示されている');
  chk(d.querySelectorAll('.drawer a[href^="privacy.html"]').length===2,'ドロワーに運営情報リンク2件');
  chk(d.querySelectorAll('form,input[type=email]').length===0,'フォーム要素0件');
  chk(!/SPI|診断者数|希少度|しかいない|12,847/.test(d.body.innerText),'LP本文に SPI/診断者数/希少度 が無い');
  chk(/探し方のヒント/.test(d.body.innerText),'hero-sub が是正済み');
  const head=d.head.innerHTML;
  ['og:title','og:description','og:image','og:url','twitter:card'].forEach(k=>chk(head.indexOf(k)>=0,'head に '+k));
  chk(head.indexOf('summary_large_image')>=0,'twitter:card=summary_large_image');

  // og:image が実在するか
  const ogi=d.querySelector('meta[property="og:image"]').content;
  const r=await fetch(ogi.replace('https://w-t-n-b.github.io/syukatsushindan/',''));
  chk(r.ok,'og:image が取得できる ('+r.status+') '+ogi);

  // ---------- B. 20問通し × 16タイプ（実ブラウザ・実DOM） ----------
  for(const want of CODES){
    await load('index.html'); w=f.contentWindow; d=f.contentDocument;
    await sleep(60);
    const av=inOrder(w,ansFor(want));
    // Q1-5 は LP にしかない。まず LP を埋める（利用者の実際の道順）
    const lpPos=posOf(d,'lq');
    if(lpPos.join(',')!=='0,1,2,3,4'){chk(false,want+': LPの出題位置ずれ '+lpPos.join(','));}
    for(const q of lpPos) w.pick(dot(d,'lq',q,av[q]));
    w.lqContinue(); await sleep(150);
    chk(d.getElementById('screen-quiz').classList.contains('active'),want+': 診断画面に遷移');
    if(want==='HALS'){
      chk(getComputedStyle(d.querySelector('.ftr')).display==='none','診断中はフッター非表示');
      chk(d.body.dataset.screen==='screen-quiz','body[data-screen]=screen-quiz');
    }
    // 診断画面はページ1-3（Q6-20）の3ページ
    for(let p=1;p<4;p++){
      const pos=posOf(d,'q');
      const wantPos=[0,1,2,3,4].map(k=>p*5+k);
      if(pos.join(',')!==wantPos.join(',')){chk(false,want+': ページ'+p+' の出題位置ずれ '+pos.join(','));break;}
      const pt=d.getElementById('prog-text').textContent;
      if(pt!=='Q'+(p*5+1)+'-'+(p*5+5)+' / 全20問'){chk(false,want+': 進捗表示ずれ '+pt);break;}
      if(want==='HALS'&&p===1){
        const grp=d.querySelectorAll('#prog-seg .ps-group').length;
        const cell=d.querySelectorAll('#prog-seg .ps-cell').length;
        const done=d.querySelectorAll('#prog-seg .ps-cell.done').length;
        const cur=[...d.querySelectorAll('#prog-seg .ps-group')].findIndex(g=>g.classList.contains('cur'));
        chk(grp===4&&cell===20,'.prog-seg は4群×5セル（群0 = LP の5問を残す）: '+grp+'群 '+cell+'セル');
        chk(done===5,'診断画面に入った時点で .ps-cell.done が5（LP の持ち越し）: '+done);
        chk([...d.querySelectorAll('#prog-seg .ps-group')[0].querySelectorAll('.ps-cell')].every(c=>c.classList.contains('done')),
            '群0（LPの5問）が塗り終わった状態で持ち越される');
        chk(cur===1,'現在地は2群目（診断画面の先頭ページ）: '+cur);
        chk(d.querySelectorAll('#prog-seg .ps-cell.cur').length===0,'セル単位の現在地表示は無い');
        chk(d.querySelectorAll('#q-list .q-card').length===5,'1画面に5問');
        chk(d.querySelectorAll('#q-list .spec-track[role="radiogroup"]').length===5,'5問ぶんが独立したラジオグループ');
        chk(d.querySelectorAll('#q-list .q-card[data-pos="0"]').length===0,'診断画面に Q1 のカードが無い（2つの入口の解消）');
      }
      for(const q of pos) w.pick(dot(d,'q',q,av[q]));
      w.nextPage();
      await sleep(80);
    }
    // ローディング 3.6s
    await sleep(6200);
    const rc=d.querySelector('.res-code');
    const got=rc?rc.textContent.trim():'(なし)';
    const gotJs=w.getCode();
    const nm=d.querySelector('.res-type-name');
    chk(d.getElementById('screen-result').classList.contains('active') && got===want,
        want+': 20問通しの判定 = '+got+'（getCode()='+gotJs+'）/ '+(nm?nm.textContent.trim():''));
    chk(gotJs===want,want+': getCode() 一致');
    if(want==='HALS'){
      const t=d.body.innerText;
      chk(!/希少度|診断者の|しかいない/.test(t),'結果画面に希少度/診断者%が無い');
      chk(!/孫正義|マッキンゼー|サイバーエージェント|トヨタ自動車|三菱商事/.test(t),'結果画面に実在の人名・企業名が無い');
      chk(/傾向の分類/.test(t),'「傾向の分類」の明示がある');
      chk(/掲載順に優劣はなく/.test(d.getElementById('screen-result').innerHTML),'職種例の注記がある');
      chk(d.querySelectorAll('.ab-link').length===0,'AGENTS が0件なので送客リンクは0件');
      chk(d.querySelectorAll('#agent-primary,#agent-secondary').length===0,'送客ブロックは DOM ごと描画されない');
      const rh=d.getElementById('screen-result').innerHTML;
      chk(rh.indexOf('最適な')<0 && rh.indexOf('あなた専用')<0 && rh.indexOf('内定率')<0,'禁止語（最適な/あなた専用/内定率）0件');
      chk(getComputedStyle(d.querySelector('.ftr')).display!=='none','結果画面ではフッター表示');
    }
  }

  // ---------- C. シェア導線 ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  await sleep(60);
  // 以前は jumpToType('HALS')（scores を捏造して結果全文を出す）で状態を作っていた。
  // C-6 でその経路を廃止したため、scores を直接置いて同じ状態を作る。
  w.eval("scores={1:5,2:5,3:5,4:5}"); await sleep(60);
  const SU=w.shareUrl('HALS');
  chk(SU==='https://w-t-n-b.github.io/syukatsushindan/?type=HALS&ref=share','shareUrl(): '+SU);
  chk(w.topUrl()==='https://w-t-n-b.github.io/syukatsushindan/','topUrl(): '+w.topUrl());
  let opened=null; w.open=(u)=>{opened=u;return null;};
  w.shareX();
  chk(decodeURIComponent(opened).indexOf(SU)>=0,'shareX のツイートURLにサイトURLが入る');
  chk(decodeURIComponent(opened).indexOf('希少')<0,'shareX から根拠なき統計が消えた');
  p('     shareX -> '+decodeURIComponent(opened).slice(0,200));
  w.shareLINE();
  chk(decodeURIComponent(opened).indexOf(SU)>=0,'shareLINE の本文にサイトURLが入る');
  p('     shareLINE -> '+decodeURIComponent(opened).slice(0,200));

  // copyLink: ?type= 付きで来た第三者がコピーしても診断トップになる
  await load('index.html?type=DBWG'); w=f.contentWindow; d=f.contentDocument;
  await sleep(200);
  chk(d.getElementById('screen-result').classList.contains('active'),'?type= 単体は従来どおり結果表示（非破壊）');
  let copied=null;
  Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:t=>{copied=t;return Promise.resolve();}}});
  w.alert=()=>{};
  w.copyLink(); await sleep(80);
  chk(copied==='https://w-t-n-b.github.io/syukatsushindan/','copyLink は診断トップを配る（?type= を含まない）: '+copied);
  w.copyResult(); await sleep(80);
  chk(copied.indexOf('?type=DBWG&ref=share')>=0,'copyResult に結果URLが入る');

  // ---------- D. ref=share 分岐 ----------
  await load('index.html?type=HALS&ref=share'); w=f.contentWindow; d=f.contentDocument;
  await sleep(300);
  chk(d.getElementById('screen-title').classList.contains('active'),'ref=share: LP が active');
  chk(!d.getElementById('screen-result').classList.contains('active'),'ref=share: 結果画面は非表示');
  chk(d.getElementById('screen-result').innerHTML.trim()==='','ref=share: 結果DOMそのものが生成されていない');
  const sb=d.querySelector('.shared-banner');
  chk(!!sb,'ref=share: .shared-banner がある');
  chk(sb && /HALS/.test(sb.innerText) && /オンオフのエース/.test(sb.innerText),'ref=share: HALS / オンオフのエース が出る');
  chk(!!(sb&&sb.querySelector('.sb-cta')),'ref=share: 診断開始CTAがある');
  sb.querySelector('.sb-cta').click(); await sleep(400);
  // §A-6: 友達のリンクで来た人こそ段差なしで答え始めさせる。#screen-quiz には飛ばさない。
  chk(!d.getElementById('screen-quiz').classList.contains('active'),'ref=share: CTAで #screen-quiz に飛ばない');
  chk(d.getElementById('screen-title').classList.contains('active'),'ref=share: LPのまま');
  chk(posOf(d,'lq').join(',')==='0,1,2,3,4','ref=share: #lp-quiz（Q1-5）に着地する: '+posOf(d,'lq').join(','));

  // ---------- E. 送客ブロック（AGENTS に1件入れたときの描画） ----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument;
  await sleep(60);
  // const 宣言は window のプロパティにならないので eval 経由で触る
  w.eval("AGENTS.push({id:'test-ca',name:'テストCA',url:'https://example.com/lp?a=1',forWhom:'まず何から始めるか決めきれていない人',meta:'無料／オンライン面談30分／連絡は原則メール・電話なし',company:'テスト株式会社',license:''})");
  // 未診断者の経路では出ないこと（C-6：16タイプ一覧のタップは結果全文を出さなくなった）
  d.querySelector('#type-overview .tc[data-code="HALS"]').click(); await sleep(300);
  chk(d.querySelectorAll('.ab-link').length===0,'16タイプ一覧のタップでは送客リンクを描画しない');
  chk(!d.getElementById('screen-result').classList.contains('active'),'16タイプ一覧のタップで結果画面に遷移しない');
  await load('index.html?type=HALS'); const w2=f.contentWindow;
  await sleep(250);
  w2.eval("AGENTS.push({id:'t',name:'t',url:'https://e.com',forWhom:'x',meta:'電話なし'});showResult(true,'shared')");
  await sleep(150);
  chk(f.contentDocument.querySelectorAll('.ab-link').length===0,'?type= 来訪（未診断者）でも送客ブロックを描画しない');
  // 20問回答した人にだけ出る
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(80);
  w.eval("AGENTS.push({id:'test-ca',name:'テストCA',url:'https://example.com/lp?a=1',forWhom:'まず何から始めるか決めきれていない人',meta:'無料／オンライン面談30分／連絡は原則メール・電話なし',company:'テスト株式会社',license:''})");
  await runQuiz(w,d,inOrder(w,ansFor('HALS')));
  await sleep(6200);
  const ap=d.getElementById('agent-primary'), as=d.getElementById('agent-secondary');
  chk(!!ap&&!!as,'1件入れると #agent-primary / #agent-secondary が出る');
  chk(!!ap&&ap.querySelector('.ab-lbl').textContent==='PR','PR表記がブロック冒頭にある');
  const lk=ap.querySelector('a.ab-link');
  chk(lk.target==='_blank'&&/sponsored/.test(lk.rel)&&/noopener/.test(lk.rel),'rel/target: '+lk.rel+' / '+lk.target);
  chk(/電話/.test(ap.querySelector('.ab-meta').textContent),'.ab-meta に連絡手段（電話の有無）');
  chk(ap.querySelectorAll('.ab-note').length===1 && !/許可/.test(ap.querySelector('.ab-note').textContent),'許可番号が空なら出さない: '+ap.querySelector('.ab-note').textContent);
  chk(lk.getAttribute('href').indexOf('utm_content=HALS-primary')>=0,'utm_content=<CODE>-<position>: '+lk.getAttribute('href'));
  chk(!!ap.querySelector('.ab-disc'),'.ab-disc（紹介料の開示）がある');
  // 「向いている職種」パネルの直後か
  const panels=[...d.querySelectorAll('#screen-result .r-panel')];
  const jobPanel=panels.find(x=>/向いている職種/.test(x.textContent));
  chk(jobPanel && jobPanel.nextElementSibling===ap,'#agent-primary が「向いている職種」パネルの直後');

  // ---------- H. LP埋め込み質問（5問・設置場所はヒーローの外）----------
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(400);

  // ---------- O. キャラ画像の頭が切れていないこと ----------

  // 枠幅が可変な .tc は、いちばん強く切り取る条件（f=0.397 / vw>=480）でも確かめる。
  // キャラマーキー（.cc）は廃止したので、対象は .tc だけになった。
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
  {
    const probe=(sel,imgSel,fMin)=>{
      const out=[];
      d.querySelectorAll(sel).forEach(card=>{
        const im=card.querySelector(imgSel); if(!im)return;
        const code=(im.src.match(/([a-d]\d)\.webp/)||[])[1]||'?';
        if(out.some(o=>o.code===code))return;
        const head=parseFloat(getComputedStyle(card).getPropertyValue('--head'));
        const y=parseFloat(getComputedStyle(im).objectPosition.split(' ')[1]);
        /* object-fit が働くのは padding を除いたコンテンツ領域。DAWG(c4) は
           左右に padding を入れて描画幅を縮めているので、border-box の幅で
           計算すると実際より強く切り取られていると誤判定する。 */
        const cs=getComputedStyle(im);
        const b=im.getBoundingClientRect();
        const padded=b.width-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
        const inner=b.height-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
        const fNow=inner/(padded*(im.naturalHeight/im.naturalWidth));
        const marg=ff=>ff>=1?100:(head-y*(1-ff))/(100*ff)*100;
        /* fMin は枠幅が可変な .tc の最悪条件。padding があるキャラは幅の比率が
           変わるので、実測の f との比で補正する。 */
        const fMinAdj=fMin*(fNow/(b.height/(b.width*(im.naturalHeight/im.naturalWidth))));
        out.push({code,head,y,f:+fNow.toFixed(3),now:+marg(fNow).toFixed(1),min:+marg(fMinAdj).toFixed(1)});
      });
      return out;
    };
    const tc=probe('#type-overview .tc','img',0.397);
    chk(tc.length===16&&tc.every(o=>!isNaN(o.head)),'16タイプ一覧の全16体に --head（実測の頭頂位置）が定義されている: '+tc.length);
    // 帯を廃止したので、--head を消費するのは .tc だけ。「消えたままである」ことを検査する。
    chk(d.querySelectorAll('.char-strip-outer,.char-strip-track,.cc').length===0,
        'キャラマーキー（.char-strip-outer / .char-strip-track / .cc）が DOM に存在しない');
    chk(getComputedStyle(d.querySelector('#type-overview .tc')).getPropertyValue('--head').trim()!=='',
        '--head は .tc 側で生きている（帯と一緒に消していない）');
    const badTc=tc.filter(o=>o.now<0||o.min<0);
    chk(badTc.length===0,'16タイプ一覧で頭が切れている体が0件'+(badTc.length?' → '+badTc.map(o=>o.code+'(余白'+Math.min(o.now,o.min)+'%)').join(','):''));
    /* 「余白 > 0」だけでは足りない。余白 4%（128px の枠で 5px）のとき、数値上は
       入っていても髪の先端が枠線に接して「切れている」と報告された（DAWG）。
       見た目の余白として 8% 以上を要求する。--head の値そのものは実測に依存する
       ので固定しない（画像を差し替えれば変わる。make heads で再計測する）。 */
    /* 目標は 8% だが、素材自身の頭上の余白がそれ未満のキャラでは達成できない
       （a2 は頭頂 1.4% なので、Y=0 にしても 1.4% ぶんしか出せない）。
       したがって条件は「8% 以上」ではなく「切り取りで余白を減らしていないこと」——
       すなわち 8% を満たすか、Y=0（画像の最上部から出しており、これ以上できない）。 */
    /* 8% を目標にしていたが、素材自身の頭上の余白がそれ未満のキャラが多く
       （実測 2.2〜9%）、Y=0 の免除でしか通らない状態だった。実測の中央値に
       近い 5% を下限とする。これを下回ると枠線に接して見える。 */
    const MIN_MARGIN=5;
    const tight=o=>Math.min(o.now,o.min)<MIN_MARGIN && o.y>0.01;
    const tightTc=tc.filter(tight);
    chk(tightTc.length===0,'16タイプ一覧: 頭上の余白が'+MIN_MARGIN+'%以上、または Y=0（素材の上限）'
        +(tightTc.length?' → '+tightTc.map(o=>o.code+':余白'+Math.min(o.now,o.min)+'% Y='+o.y+'%').join(','):''));
    // 頭頂がいちばん低い c4 は、固定値だと必ず破綻する。名指しでも押さえておく。
    const c4=tc.find(o=>o.code==='c4');
    chk(!!c4&&c4.head>=8,'DAWG(c4) の --head は実測どおり低い位置にある: '+(c4&&c4.head));
    p('     .tc 余白(%): '+tc.map(o=>o.code+':'+o.now).join(' '));
    // 結果画面のキャラ枠は縦の切り取りが起きない（f>=1）。ここを変えていないこと。

  // ---------- P. LPに不自然な空白帯ができていないこと ----------
  // 実際に起きた不具合: .wrap の padding-bottom:100px が LP の中間セクションにも
  // 効いていて、.steps の下端から .type-grid の上端までが 329px 空いていた。
  // 「どこかのセクションが下に空白を抱えている」を一般化して押さえる。
  //   帯の測り方: #screen-title 内の「中身のある末端要素」を上から並べ、
  //   直前までの最下端と次の要素の上端の差＝どの要素も存在しない横帯の高さ。
  // 閾値 120px の根拠: セクション間の意図した空きは 40px + 40px = 80px。
  //   100px の死に領域が1つでも復活すると 180px になるので、その間に置く。
  const BAND=`(()=>{
    const root=document.getElementById('screen-title');
    const boxes=[];
    /* 「葉」の判定。子要素が <br> だけの要素も葉として数える。
       ここを子要素の有無だけで見ていたため、.hero-sub（<br> を1つ持つ本文2行）が
       ずっと集計から漏れていた。ヒーローCTA（BUTTON）がその下にあったあいだは
       CTA が最下端を作っていたので露見しなかったが、CTA を削除したところ
       「.hc（薄い装飾キャラ）の下端から次の文字まで」を帯として数え始めた。
       それは利用者に見えている空白ではない。見えている文字の下端から測る。 */
    const isLeaf=e=>e.children.length===0
      || [...e.children].every(c=>c.tagName==='BR')
      || /^(BUTTON|IMG)$/.test(e.tagName);
    root.querySelectorAll('*').forEach(e=>{
      if(!isLeaf(e)) return;
      const cs=getComputedStyle(e);
      if(cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity)===0) return;
      const r=e.getBoundingClientRect();
      if(r.height<=0||r.width<=0) return;
      boxes.push({t:r.top+scrollY,b:r.bottom+scrollY,
        tag:e.tagName+(e.id?'#'+e.id:'')+(typeof e.className==='string'&&e.className?'.'+e.className.trim().split(/\\s+/)[0]:'')});
    });
    boxes.sort((a,b)=>a.t-b.t);
    let maxB=null,prev='',worst={gap:0,after:'',before:''};
    boxes.forEach(x=>{
      if(maxB!==null && x.t-maxB>worst.gap) worst={gap:x.t-maxB,after:prev,before:x.tag};
      if(maxB===null||x.b>maxB){maxB=x.b;prev=x.tag;}
    });
    worst.gap=Math.round(worst.gap);
    return JSON.stringify(worst);
  })()`;
  for(const vw of [390,320]){
    f.style.width=vw+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
    const band=JSON.parse(w.eval(BAND));
    chk(band.gap<=120,'LP('+vw+'px)に120pxを超える空白帯が無い: 最大 '+band.gap+'px（'+band.after+' → '+band.before+'）');
    // 不具合そのものの再発も名指しで押さえる（あるセクションの直後に何も無い帯が続く）。

    /* 以前は .hero .btn-wrap（ヒーローCTA）の下端を起点にしていた。CTA を削除した

    const sb=d.querySelector('.hero .hero-sub').getBoundingClientRect().bottom;

      chk(c0.querySelector('.opt-a .opt-key').textContent==='A.'&&c0.querySelector('.opt-b .opt-key').textContent==='B.',

        &&c0.querySelector('.opt-a').textContent.indexOf('A.')===0,

      // A側 / B側の縦帯が色分けされている

      const lb=getComputedStyle(c0.querySelector('.opt-b')).borderLeftColor;
      chk(la!==lb,list+' の A側 / B側で縦帯の色が違う: '+la+' vs '+lb);
      const hint=c0.querySelector('.spec-hint');

    {
      const c=d.querySelector('#q-list .q-card[data-pos="5"]');
      chk(!c.querySelector('.opt-a').classList.contains('on')&&!c.querySelector('.opt-b').classList.contains('on'),

      const noTr2=d.createElement('style'); noTr2.textContent='.opt-line{transition:none!important}';
      d.head.appendChild(noTr2);

      w.pick(dot(d,'q',5,3)); await sleep(30);

          'A側を選ぶとA行が強調される');
      chk(getComputedStyle(c.querySelector('.opt-a')).backgroundColor!==plain,

      w.pick(dot(d,'q',5,-3)); await sleep(30);
      chk(!c.querySelector('.opt-a').classList.contains('on')&&c.querySelector('.opt-b').classList.contains('on'),
          '選び直すと強調も入れ替わる');

    d.head.appendChild(noTr);
    const bgNow=v=>getComputedStyle(dot(d,'q',6,v).querySelector('.sd')).backgroundColor;
    const off={};[3,2,1,-1,-2,-3].forEach(v=>off[v]=bgNow(v));

    [3,2,1,-1,-2,-3].forEach(v=>dot(d,'q',6,v).classList.add('sel'));

    [3,2,1,-1,-2,-3].forEach(v=>dot(d,'q',6,v).classList.remove('sel'));

    chk(on[3]!==off[3]&&on[-3]!==off[-3],'選択すると色が変わる: A '+off[3]+'→'+on[3]+' / B '+off[-3]+'→'+on[-3]);

    chk(on[3]===on[1]&&on[-3]===on[-1],'選択時の同じ側は同色（強さは大きさで示す）: A '+on[3]+' / B '+on[-3]);

  // ---------- Q-2. 目盛のタッチターゲット（WCAG 2.5.8 = 24x24）----------
  // 外側を大きく内側を小さくしたぶん、いちばん小さい ±1 が基準を割らないこと。
  // 5問ずつ化でカードの余白を詰めたので、ここが最初に効いてくる。
  // 1ページの高さも併せて測る（目標: 約1,600px以内。仕様 §D-3）。
  for(const vw of [390,320]){
    f.style.width=vw+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(700);
    for(const [face,name] of [['lq','LP埋め込み'],['q','診断画面']]){
      if(face==='q'){ await enterQuiz(w,d); }
      // 5問ぶんすべての目盛を測る（1問目だけ通っても意味がない）
      let min=1e9, sample='';
      for(const pos of posOf(d,face)){
        const rs=[3,2,1,-1,-2,-3].map(v=>{const b=dot(d,face,pos,v).getBoundingClientRect();
          return {v,w:Math.round(b.width),h:Math.round(b.height)};});
        if(pos===posOf(d,face)[0]) sample=rs.map(o=>(o.v>0?'+':'')+o.v+':'+o.w+'x'+o.h).join(' ');
        min=Math.min(min,rs.reduce((a,b)=>Math.min(a,b.w,b.h),1e9));
      }
      chk(min>=24,name+'('+vw+'px)の目盛は5問すべて・全段階が24px以上: 最小 '+min+'px / '+sample);
      // 横にはみ出していないこと
      const over=[...d.querySelectorAll('#'+(face==='lq'?'lq-list':'q-list')+' .q-card')]
        .filter(c=>c.scrollWidth>c.clientWidth+1).length;
      chk(over===0,name+'('+vw+'px)でカードから横にはみ出している問が0件');
    }
    // 1ページの高さ（診断画面）。.prog-area + 5問 + 操作列
    const pageH=Math.round(d.querySelector('.quiz-inner').getBoundingClientRect().height
                          +d.querySelector('.prog-area').getBoundingClientRect().height);
    const cardH=Math.round(d.querySelector('#q-list .q-card').getBoundingClientRect().height);
    chk(pageH<=1600,'診断画面1ページの高さ('+vw+'px): '+pageH+'px（カード1枚 '+cardH+'px・目標1,600px以内）');
    p('     '+vw+'px: 1ページ '+pageH+'px / カード1枚 '+cardH+'px / 横スクロール '
      +(d.documentElement.scrollWidth>vw));
    chk(d.documentElement.scrollWidth<=vw,'横スクロールが発生しない('+vw+'px): scrollWidth='+d.documentElement.scrollWidth);
    w.clearSavedProgress();
  }
  f.style.width='390px';

  // ---------- R. サブタイプに説明が付いていること ----------
  // 「サブタイプってなんのことだ」（オーナー）。コードとキャラだけでは伝わらない。
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(300);
  {
    // 僅差の軸を作る（軸1だけ ±1）。getSubCode() は軸1を反転したコードを返す。
    w.eval("scores={1:1,2:9,3:9,4:9};ans=[3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,-3];showResult(false,'quiz')");
    await sleep(700);
    const card=d.querySelector('.subtype-card');
    chk(!!card,'サブタイプのカードが出る');
    const note=card&&card.querySelector('.sub-note');
    chk(!!note&&note.textContent.trim().length>=30,'.sub-note に説明がある: '+(note?note.textContent.slice(0,24)+'…':'なし'));
    chk(!!note&&/僅差/.test(note.textContent),'説明が「僅差だった軸を反転したもの」であることに触れている');
    // 断定しない姿勢（診断で分かるのは傾向まで）と矛盾しないこと
    chk(!!note&&!/必ず|断言|確実|あなたは.*です。/.test(note.textContent),'説明が断定表現を含まない');
    // .sub-head「あなたのサブタイプ」は削除した（パネル見出し「サブタイプ」の
    // 言い直しだった。wording-audit.md R-14）。説明はカードの先頭に来る。
    chk(!card.querySelector('.sub-head'),'.sub-head（パネル見出しの言い直し）が無い');
    chk(card.firstElementChild===note,'説明はサブタイプのカードの先頭にある');
  }

  // ---------- S. ヒーローの作り替え（浮遊キャラ / 3ステップ削除 / ファーストビュー）----------
  // docs/design/hero-floating-characters.md 判断①〜⑭。
  // 「消したもの」と「残したもの」を両側から押さえ、コントラストは計算値ではなく
  // 実配信の webp を canvas で合成した実測値で判定する。
  // 幅の選び方: 320/390 は α の下限を決めているスマホ2体。768 は奥の2体が字面に
  // 最も深く重なる幅（em の字面は幅600px以上で 476px 固定なので、狭いほど食い込む）。
  // 1024 は据え置き。1440 は両端の2体が字面に1画素も重ならないことを押さえる幅。
  for(const [vw,vh,want] of [[390,844,2],[320,568,2],[768,1024,4],[1024,844,4],[1440,900,4]]){
    f.style.width=vw+'px'; f.style.height=vh+'px';
    await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(1200);
    const hero=d.querySelector('.hero');
    const cast=d.querySelector('.hero-cast');
    const hcs=[...d.querySelectorAll('.hc')];
    const T='('+vw+'x'+vh+') ';

    // --- 構造 ---
    chk(!!cast,T+'.hero-cast がヒーローに挿入されている');
    chk(!!cast&&cast.getAttribute('aria-hidden')==='true',T+'.hero-cast は aria-hidden="true"');
    chk(!!cast&&cast.parentElement===hero&&cast.nextElementSibling===d.querySelector('.hero-inner'),
        T+'.hero-cast は .hero 直下・.hero-inner の直前にある');
    chk(hcs.length===want,T+'浮遊キャラは '+want+' 体: '+hcs.length+' 体 '
        +hcs.map(e=>(e.src.match(/([a-d]\d)\.webp/)||[])[1]).join(','));
    chk(hcs.every(e=>e.alt===''&&e.loading==='lazy'&&e.decoding==='async'),
        T+'各 .hc は alt="" / loading=lazy / decoding=async');
    chk(hcs.every(e=>getComputedStyle(e).pointerEvents==='none'||getComputedStyle(cast).pointerEvents==='none'),
        T+'.hc は押せない（pointer-events:none）');
    chk(hcs.every(e=>e.complete&&e.naturalWidth>0),T+'.hc の画像がすべて読み込めている');
    // ヒーローの高さはビューポートに依らずほぼ一定（判断②）
    const heroH=Math.round(hero.getBoundingClientRect().height);
    chk(getComputedStyle(hero).minHeight==='auto'||parseFloat(getComputedStyle(hero).minHeight)===0,
        T+'.hero に min-height が効いていない: '+getComputedStyle(hero).minHeight);
    /* 範囲はヒーローCTA（#cta-hero）の削除にあわせて引き下げた（オーナー判断・案C）。
       CTA本体 約60px ＋ .hero-sub の下マージン 28px ＝ 約97px ぶん背が低くなった。
       実測 337px（390幅）/ 357px（320幅）。守っているのは変わらず
       「min-height を持たず、中身の積算そのもの」「ビューポート未満」の2点で、
       下限は「ヒーローが不意に潰れていない」ことを見るために残す。 */
    chk(heroH<vh&&heroH>=300&&heroH<=460,
        T+'ヒーローの高さが中身の積算そのもの（300〜460px・ビューポート未満）: '+heroH+'px');
    chk(d.documentElement.scrollWidth<=vw,T+'横スクロールが出ない: scrollWidth='+d.documentElement.scrollWidth);
    // 装飾円とシルエット（判断⑧⑪）
    chk([...d.querySelectorAll('.hero .hero-orb')].every(e=>getComputedStyle(e).display==='none'),
        T+'ヒーローの装飾円 .o1/.o2/.o3 が出ていない');
    chk(d.querySelectorAll('.hero .hero-orb').length===3,T+'装飾円の DOM は残っている（消していない）');
    chk(getComputedStyle(d.querySelector('.hero-sil')).display==='none',T+'.hero-sil は display:none のまま');

    // --- 幾何：重なりと CTA（§3-2 / §7-2）---
    if(hcs.length){
      hcs.forEach(e=>{e.style.animation='none';});
      await sleep(60);
      const rects=hcs.map(e=>e.getBoundingClientRect());
      let cross=[];
      for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++){
        const a=rects[i],b=rects[j];
        if(a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom)cross.push(i+'x'+j);
      }
      chk(cross.length===0,T+'.hc 同士が重なっていない（重なると実効αが上がり AA を割る）'
          +(cross.length?' → '+cross.join(','):''));
      /* ヒーローCTA（#cta-hero）を削除した（オーナー判断・案C）ので、
         「押せるものの外形に .hc を重ねない」（1.4.11）の対象は
         .cont-banner（再訪者にだけ出る復帰バナー）1つになった。
         既定では display:none なので、測るあいだだけ出す。
         検査そのものは消さない —— 消すと、次に誰かがヒーローへ
         押せるものを戻したときに、重なりを誰も見なくなる。 */
      const cb=d.getElementById('cont-banner');
      const cbPrev=cb.style.display;
      cb.style.display='flex';
      await sleep(60);
      const btn=cb.getBoundingClientRect();
      const gaps=rects.map(r=>Math.round(btn.top-6-(r.bottom)));
      chk(Math.min(...gaps)>6,
          T+'どの .hc も復帰バナーの外形（影 6px 込み）に重ならない（1.4.11）: 余裕 '+gaps.join(' / ')+'px');
      cb.style.display=cbPrev;
      await sleep(60);
      // 顔は見出しより上（§3-4 の不等式1）
      const ttl=d.querySelector('.hero-title').getBoundingClientRect();
      chk(rects.every(r=>r.top+30<=ttl.top),
          T+'顔（上端から約30px）が見出しの上端より上にある: hc上端 '+rects.map(r=>Math.round(r.top)).join('/')+' / 見出し上端 '+Math.round(ttl.top));

      // --- コントラスト実測（§7-1）。矩形ではなく字面の背後を測る ---
      const titleEl=d.querySelector('.hero-title');
      const emEl=titleEl.querySelector('em');
      const subEl=d.querySelector('.hero-sub');
      const TXT=[
        // 見出しは 25.6px 以上 / font-weight:900 → WCAG の「大きな文字」で 3:1
        ['見出し2行目 --must', hex('#cf9a24'), 3,   inkRects(emEl,6)],
        ['見出し1行目 --paper',hex('#f2ece0'), 3,   inkRects(titleEl,6)],
        ['本文 #c3cbdd',       hex('#c3cbdd'), 4.5, inkRects(subEl,6)],
      ];
      for(const [name,col,need,areas] of TXT){
        chk(areas.length>0,T+name+' の字面を取得できた: '+areas.length+'行 '
            +areas.map(a=>'x'+Math.round(a.left)+'〜'+Math.round(a.right)).join(' '));
        const tl=lum(col[0],col[1],col[2]);
        let worst=null,worstI=null;
        hcs.forEach((im,i)=>{
          const a=parseFloat(getComputedStyle(im).opacity);
          for(const area of areas){
            const b=worstPixel(im,rects[i],a,area);
            if(b&&(!worst||b.l>worst.l)){worst=b;worstI=i;}
          }
        });
        if(!worst){p('     '+T+name+'：字面の背後に .hc の画素なし（比は地色のまま）');continue;}
        const onLine=ratio(tl,worst.l), between=ratio(tl,worst.inter);
        chk(onLine>=need,
          T+name+' の字面の背後に .hc がある最悪画素で '+onLine.toFixed(3)+':1（基準 '+need+':1）'
          +' / 線の間 '+between.toFixed(3)+':1'
          +' ← '+(hcs[worstI].src.match(/([a-d]\d)\.webp/)||[])[1]
          +' α='+getComputedStyle(hcs[worstI]).opacity
          +' rgb('+worst.rgb.join(',')+') 実効α='+worst.a);
      }
      /* 以前はここでヒーローCTAの面（--verm）に .hc の画素が乗っていないことを
         見ていた。CTA を削除したので、同じ検査を復帰バナーの面（--paper）で行う。
         バナーは押せる要素であり、その地色と縁が .hc に汚されないことが要件。 */
      {
        const paper=hex('#f2ece0'),pl=lum(...paper);
        cb.style.display='flex';
        await sleep(60);
        const cbr=cb.getBoundingClientRect();
        let hit=null;
        hcs.forEach((im,i)=>{
          const b=worstPixel(im,rects[i],parseFloat(getComputedStyle(im).opacity),
            {left:cbr.left-6,right:cbr.right+6,top:cbr.top-6,bottom:cbr.bottom+6});
          if(b&&(!hit||b.l>hit.l))hit=b;
        });
        const bg=hit?hit.l:lum(...LINE);
        chk(!hit,T+'復帰バナーの外形に .hc の画素が1つも無い（--paper と背景の比 '+ratio(pl,bg).toFixed(3)
            +':1 は .hc に影響されない）');
        cb.style.display=cbPrev;
        await sleep(60);
      }
      hcs.forEach(e=>{e.style.animation='';});
    }

    // --- ファーストビュー（判断⑩）---
    {
      const q1=d.querySelector('#lq-list .q-card[data-pos="0"]');
      chk(!!q1,T+'ファーストビュー側に Q1 のカードがある');
      const b=q1.getBoundingClientRect();
      const part=s=>{const e=q1.querySelector(s);return e?Math.round(e.getBoundingClientRect().bottom):null;};
      p('     '+T+'Q1 カード y '+Math.round(b.top)+'〜'+Math.round(b.bottom)+' / fold '+vh
        +'（質問文 '+part('.q-text')+' / 選択肢 '+part('.choice-list')+' / 目盛 '+part('.spec-track')+'）');
      if(vw===390&&vh===844){
        chk(b.bottom<=vh,'390x844: Q1 のカード全体がファーストビューに入る: 下端 '+Math.round(b.bottom)+'px ≦ '+vh);
      }else if(vw===320&&vh===568){
        chk(b.top<vh,'320x568: Q1 のカードがファーストビューに顔を出す: 上端 '+Math.round(b.top)+'px < '+vh);
        chk(part('.q-text')!==null,'320x568: 質問文の要素がある（どこまで入るかは上の実測ログ）');
      }
    }

    // --- 動きの抑制（§7-3）。CSSOM から実際にパースされた規則を見る ---
    if(vw===390){
      let kf=null,rm=false;
      for(const ss of d.styleSheets){
        let rules;try{rules=ss.cssRules;}catch(e){continue;}
        for(const r of rules){
          if(r.type===CSSRule.KEYFRAMES_RULE&&r.name==='hcFloat')kf=r;
          if(r.type===CSSRule.MEDIA_RULE&&/prefers-reduced-motion/.test(r.conditionText)){
            for(const ir of r.cssRules)if(ir.selectorText==='.hc'&&ir.style.animationName==='none')rm=true;
          }
        }
      }
      chk(!!kf,'@keyframes hcFloat がスタイルシートに存在する');
      if(kf){
        const at=n=>[...kf.cssRules].find(r=>r.keyText.split(',').map(s=>s.trim()).includes(n));
        const a0=at('0%'),a100=at('100%');
        const zero=r=>!r||/^translateY\(0(px)?\)$/.test((r.style.transform||'').trim());
        chk(!!a0&&zero(a0)&&zero(a100),
            'hcFloat の 0% / 100% がともに translateY(0)（抑制時にずれた位置で止まらない）: '
            +(a0?a0.style.transform:'なし'));
      }
      chk(rm,'@media (prefers-reduced-motion:reduce) の .hc{animation:none} が実際にパースされている');
      // 抑制されていない通常時は、実際に animation が走っている
      const st=hcs[0]&&getComputedStyle(hcs[0]);
      chk(!!st&&st.animationName==='hcFloat'&&parseFloat(st.animationDuration)>=11,
          '通常時はゆらぎが動いている: '+(st&&st.animationName)+' '+(st&&st.animationDuration));
    }
  }
  // 768px 以上で開いた窓を狭めたとき、奥の2体が残って手前の2体と重ならないこと。
  // JS は読み込み時に1回だけ体数を決める（回転のたびに画像を追加取得しない）ので、
  // 残った4枚のうち奥の2体は CSS で消す。重なると実効αが 1-(1-a)(1-b) まで上がり、
  // 見出し2行目が AA を割る。
  f.style.width='1024px'; f.style.height='844px';
  await load('index.html'); w=f.contentWindow; d=f.contentDocument; await sleep(1200);
  {
    const all=[...d.querySelectorAll('.hc')];
    chk(all.length===4,'リサイズ検査: 1024px では 4 体が挿入されている: '+all.length+' 体');
    f.style.width='390px'; f.style.height='844px';
    await sleep(400);
    const vis=all.filter(e=>getComputedStyle(e).display!=='none');
    chk(vis.length===2&&vis.every(e=>/hc-[14]\b/.test(e.className)),
        '1024px→390px に狭めても出るのは手前の2体だけ（奥の2体は display:none）: '
        +vis.map(e=>e.className.replace('hc ','')).join(',')||'なし');
    if(vis.length===2){
      vis.forEach(e=>{e.style.animation='none';});
      const a=vis[0].getBoundingClientRect(),b=vis[1].getBoundingClientRect();
      chk(!(a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom),
          '狭めたあとも .hc 同士の矩形が交差しない');
      vis.forEach(e=>{e.style.animation='';});
    }
  }
  f.style.width='390px'; f.style.height='844px';

  // 共有リンク（?ref=share）で来た人には浮遊キャラを出さない（§4 の状態表）
  await load('index.html?type=HALS&ref=share'); w=f.contentWindow; d=f.contentDocument; await sleep(900);
  chk(!!d.querySelector('.shared-banner'),'?ref=share で .shared-banner が出る');
  chk(d.querySelectorAll('.hc').length===0||getComputedStyle(d.querySelector('.hero-cast')).display==='none',
      '.shared-banner があるときは浮遊キャラを出さない（見えない絵を読まない）');

  p('\n===== '+(fail===0?'ALL PASS':fail+' FAILURES')+' =====');
}catch(e){p('EXCEPTION: '+(e&&e.stack||e));p('\n===== EXCEPTION =====');}
document.title='DONE';
})();
</script></body></html>
